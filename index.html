<style>

.tb{width:100%;border-collapse:collapse}.tb th,.tb td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left;font-size:14px;vertical-align:middle}.tb th{color:var(--mut);font-weight:500}

.bn{font:700 22px/1 var(--df);letter-spacing:.02em}.hr{display:flex;align-items:center;gap:8px}

.card{border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.14)}

.st{display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right}

.sc{font:700 22px/1 var(--df)}.mn{font-size:12px;font-weight:600;color:var(--red)}
.ftb{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
@media (prefers-reduced-motion:reduce){.seg .ind{transition:none}.lv{animation:none}}
.lr{display:grid;grid-template-columns:42px minmax(0,1fr) 30px 58px 30px minmax(0,1fr);gap:8px;align-items:center;padding:14px 10px;cursor:pointer}
.lr .lh{text-align:right;font-weight:600}.lr .la{text-align:left;font-weight:600}.lr .lh,.lr .la{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lst{font-size:12px;font-weight:700;color:var(--mut)}.lst.red{color:var(--red)}
.lsc{text-align:center;font:700 22px/1 var(--df);letter-spacing:.04em}
.lr{grid-template-columns:42px minmax(0,1fr) 30px minmax(58px,auto) 30px minmax(0,1fr)}
.lcn{text-align:center}.dtl{font-size:11px;color:var(--mut);margin-top:2px;white-space:nowrap}
.sl{grid-column:1/-1;text-align:center;font-size:12px;color:var(--mut);margin-top:-2px}
.gh{display:flex;justify-content:space-between;align-items:center;margin:20px 0 6px;padding-bottom:6px;border-bottom:1px solid var(--line)}

.cv{all:unset;cursor:pointer;color:var(--mut);font-size:20px;line-height:1;padding:4px 8px;transition:transform .2s}.cv.cl{transform:rotate(180deg)}
.cv:focus-visible{outline:2px solid var(--acc)}
.days{display:flex;gap:20px;overflow-x:auto;padding:2px 2px 0;margin:2px 0 6px;border-bottom:1px solid var(--line)}
.days button{all:unset;cursor:pointer;white-space:nowrap;padding:8px 0;color:var(--mut);font-weight:600;border-bottom:2px solid transparent}
.days button.on{color:var(--ink);border-bottom-color:var(--acc)}.days button:focus-visible{outline:2px solid var(--acc)}
.evs{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);font-size:13px}
.evs .evh{text-align:right}.evs .eva{text-align:left}.evs div div{margin-top:3px}.ems{color:var(--mut);font-weight:600}
.dhr{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:12px}
.dht{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:14px}.dht .lg{width:50px;height:50px;font-size:15px}
.dhc{display:flex;flex-direction:column;align-items:center;gap:4px}.dhs{font:700 36px/1 var(--df);letter-spacing:.04em}
.tl{padding:4px 12px}.te{display:grid;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.te.h{grid-template-columns:36px 24px 1fr}.te.a{grid-template-columns:1fr 24px 36px;text-align:right}
.te.a .tmn{order:3}.te.a .tic{order:2}.te.a .tbd{order:1}
.tmn{font:700 14px var(--sf);color:var(--mut)}.tic{text-align:center}
.cd{display:inline-block;width:12px;height:16px;border-radius:2px;vertical-align:middle}.cd.y{background:#f5c518}.cd.r{background:#e5322d}
.sin{color:var(--ok)}.sout{color:var(--red)}
.tm0{text-align:center;padding:12px 0;font-weight:700;border-bottom:1px solid var(--line)}
.ring{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);font-size:12px;margin-right:6px}
.calr{display:flex;align-items:center;gap:8px;margin:2px 0 8px}
.calb{position:relative;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 13.5px var(--sf);cursor:pointer}
.calb svg{color:var(--acc)}.calb input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
</style>

<body>
<nav class="rail" id="rail" aria-label="Étapes"></nav>
<main>
<header class="top"><div class="brand"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--acc)"/><path d="M7 22l6-7 4 4 8-10" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><div><div class="bn">Pronos Lab</div><div class="sub">Analyse football</div></div></div><div class="hr"><span class="pill" id="src"></span><button class="chip" onclick="th()" aria-label="Changer de thème">◐</button></div></header>
<div class="sub" id="st"></div>
<div id="app"></div>
<p class="sub">Les probabilités sont des estimations statistiques, jamais des certitudes. Jouez avec modération.</p>
</main>
<script>
// ===== CONFIG API : à renseigner =====
const CONFIG={API_BASE_URL:"/api"}; // la clé API reste sur le serveur (variable API_KEY de server.js)
const Q=new URLSearchParams(location.search);
const MODE=Q.has("demo")?"demo":Q.get("src")==="api"?"api":"csv"; // défaut : CSV gratuit ; ?src=api : API-Football ; ?demo : démonstration
const LIVE=MODE!=="demo";

// ===== COUCHE DONNÉES (séparée de l'interface et de l'analyse) =====
// Format attendu : {id,comp,home,away,kickoff,st:{yc:[dom,ext],sh,fo,th,co},odds?:{yc,sh,fo,th,co}}
const D=(o,h,mi)=>{const d=new Date();d.setDate(d.getDate()+o);d.setHours(h,mi,0,0);return d};
const M=(id,comp,home,away,k,s)=>({id,comp,home,away,kickoff:k,st:{yc:s[0],sh:s[1],fo:s[2],th:s[3],co:s[4]}});
const Demo={async matches(){return[
M(1,'Premier League','Arsenal','Chelsea',D(0,17,30),[[1.7,2.3],[15,12],[10,12],[20,19],[6.1,4.8]]),
M(2,'Premier League','Newcastle','Everton',D(1,16,0),[[2.0,2.4],[14,11.5],[11.5,12.5],[21,20],[5.8,4.9]]),
M(3,'La Liga','Real Madrid','Séville',D(1,21,0),[[1.8,2.6],[16,11],[11,13.5],[19,21],[6.4,4.4]]),
M(4,'La Liga','FC Barcelone','Valence',D(2,18,30),[[1.5,2.4],[17,10],[10,13],[18,22],[6.0,4.6]]),
M(5,'Ligue 1','PSG','Marseille',D(0,21,0),[[1.9,2.6],[17,12],[11,13.5],[19,20],[6.6,4.9]]),
M(6,'Ligue 1','Lyon','Monaco',D(1,19,0),[[1.8,1.7],[13,13],[12,11],[21,20],[5.2,5.0]]),
M(7,'Bundesliga','Bayern','Dortmund',D(2,18,30),[[1.6,2.5],[18,13],[9.5,12],[17,20],[6.8,5.3]]),
M(8,'Bundesliga','Leverkusen','Leipzig',D(3,15,30),[[1.9,2.0],[15,13],[11,12],[20,21],[5.9,5.2]]),
M(9,'Serie A','Inter','Juventus',D(0,20,45),[[2.2,2.5],[13,11],[12.5,13.8],[20,21],[5.6,4.5]]),
M(10,'Serie A','Milan','Naples',D(1,18,0),[[2.3,2.1],[12,14],[12,12.5],[22,19],[5.0,5.5]]),
M(11,'Ligue des champions','Atlético','Benfica',D(3,21,0),[[2.6,2.3],[11,12],[13,12],[19,21],[4.8,5.2]]),
M(12,'Europa League','Roma','Villarreal',D(2,21,0),[[2.1,2.3],[12,11],[12.5,12],[20,19],[5.3,4.7]]),
{...M(13,'Premier League','Aston Villa','Brighton',new Date(Date.now()-37*6e4),[[2.0,1.9],[13,12],[11,10.5],[19,20],[5.5,5.2]]),live:{score:[1,0]},events:[{s:'h',g:1,m:"23'",n:'J. Martin'}]},
{...M(14,'La Liga','Atlético','Betis',new Date(Date.now()-68*6e4),[[2.4,2.1],[12,11],[12.5,12],[20,18],[4.9,5.1]]),live:{score:[1,1]},events:[{s:'h',g:1,m:"12'",n:'L. Costa'},{s:'a',y:1,m:"41'",n:'R. Diaz'},{s:'a',g:1,p:1,m:"55'",n:'M. Silva'}]},
{...M(15,'Serie A','Atalanta','Torino',new Date(Date.now()-26*36e5),[[2.1,2.3],[14,10],[11.5,12],[20,19],[5.8,4.6]]),done:true,score:[2,1],events:[{s:'h',g:1,m:"9'",n:'T. Rossi'},{s:'a',g:1,m:"38'",n:'G. Bianchi'},{s:'a',r:1,m:"70'",n:'P. Neri'},{s:'h',g:1,o:1,m:"84'",n:'D. Conti'}],real:{yc:[2,3],sh:[16,9],fo:[10,13],th:[21,18],co:[7,3]}},
{...M(16,'Ligue 1','Nice','Lille',new Date(Date.now()-5*36e5),[[1.9,2.0],[12,11],[11,11.5],[19,18],[5.1,5.3]]),done:true,score:[0,0],real:{yc:[1,2],sh:[10,12],fo:[12,9],th:[17,22],co:[4,6]}}]}};
const LEAGUES={39:"Premier League",140:"La Liga",61:"Ligue 1",78:"Bundesliga",135:"Serie A",2:"Ligue des champions",3:"Europa League"};
const LAST_N=8,MAX_MATCHES=10,DAYS_AHEAD=1;
const apiState=x=>{const s=x.fixture.status&&x.fixture.status.short,g=x.goals||{};if(['1H','HT','2H','ET','BT','P','LIVE'].includes(s))return{live:{min:x.fixture.status.elapsed,score:[g.home||0,g.away||0],ht:s=='HT'}};if(['FT','AET','PEN'].includes(s))return{done:true,score:[g.home||0,g.away||0]};return{}};
const Api={
 async get(p){const r=await fetch(CONFIG.API_BASE_URL+p);const j=await r.json().catch(()=>({}));
  if(!r.ok||(j.errors&&Object.keys(j.errors).length))throw new Error(Object.values(j.errors||{})[0]||"HTTP "+r.status);return j.response},
 stat(l,t){const s=l.find(x=>x.type===t);return parseFloat(s&&s.value)||0},
 async teamAvg(id){ // 2 requêtes par équipe : derniers matchs, puis leurs statistiques (ids=a-b-c)
  const now=new Date(),S=now.getMonth()>=6?now.getFullYear():now.getFullYear()-1,iso=d=>d.toISOString().slice(0,10),ago=new Date(now.getTime()-120*864e5);
  let all;try{all=await this.get(`/fixtures?team=${id}&season=${S}&status=FT`)}catch(e1){try{all=await this.get(`/fixtures?team=${id}&from=${iso(ago)}&to=${iso(now)}&status=FT`)}catch(e2){throw new Error(e1.message)}}
  const prev=all.filter(f=>!f.league||f.league.season==S).sort((a,b)=>a.fixture.timestamp-b.fixture.timestamp).slice(-LAST_N); // saison en cours uniquement
  if(!prev.length)throw new Error("Aucun match terminé trouvé pour cette équipe");
  let det;try{det=await this.get(`/fixtures?ids=${prev.map(f=>f.fixture.id).join("-")}`)}catch(e){det=[];for(const f of prev.slice(-5))det.push({statistics:await this.get(`/fixtures/statistics?fixture=${f.fixture.id}`)})}
  const a={yc:0,sh:0,fo:0,th:0,co:0};let n=0;
  for(const d of det){const t=(d.statistics||[]).find(x=>x.team.id===id);if(!t)continue;n++;
   a.yc+=this.stat(t.statistics,"Yellow Cards");a.sh+=this.stat(t.statistics,"Total Shots");a.fo+=this.stat(t.statistics,"Fouls");
   a.co+=this.stat(t.statistics,"Corner Kicks");a.th+=this.stat(t.statistics,"Throw-ins")}
  return Object.fromEntries(Object.entries(a).map(([k,v])=>[k,n?v/n:0]))},
 async odds(id){ // vraies cotes « Plus de X » : corners et cartons ; les autres critères restent simulés
  try{const r=await this.get("/odds?fixture="+id),bk=(r[0]&&r[0].bookmakers)||[],out={};

 if(fl.length<2)return h+empty('Il faut au moins 2 matchs analysés.');
 if(!cb.length)return h+empty('Aucune combinaison de 2 ou 3 matchs ne correspond à la cote visée.');
 return h+cb.map((c,i)=>`<div class="card"><div class="row" style="margin:0"><b style="font-size:17px">${i==0?'★ ':''}Combinaison ${i+1}</b><div class="big" style="color:var(--red)">${f2(c.odd)}</div></div>`+
 c.legs.map(t=>`<div class="row"><div><b class="lnk" onclick="od(${t.m.id})">${t.m.home} – ${t.m.away} ›</b><div class="sub">Plus de ${f1(t.line)} ${t.c.n.toLowerCase()} · moyenne ${f1(t.mean)} · ${pc(t.p)}${hit(t)===null?'':hit(t)?' · ✓ réussi':' · ✗ raté'}</div>${whyBox(t)}</div><b class="big" style="font-size:22px">${f2(t.odd)}</b></div>`).join('')+
 `<div class="key">Synthèse : ${c.legs.length} matchs, cote totale ${f2(c.odd)}, probabilité conjointe estimée à ${pc(c.p)}. Chaque sélection part d'une moyenne combinée supérieure à sa ligne.${c.legs.every(t=>hit(t)!==null)?` Résultat réel : ${c.legs.every(hit)?'gagné ✓':'perdu ✗'}.`:''}</div></div>`).join('')}

const FM={V:'var(--ok)',N:'#f5a524',D:'var(--red)'};
const TL={};
function loadTL(m){if(!m||!m.espn||!(m.live||m.done)||MODE==='demo')return;const T=TL[m.id];if(T&&Date.now()-T.t<25e3)return;
 TL[m.id]={t:Date.now(),events:T?T.events:null,stats:T?T.stats:null,err:null};
 fetch(`/match?league=${encodeURIComponent(m.espn.lg)}&event=${encodeURIComponent(m.espn.id)}&h=${encodeURIComponent(m.espn.h)}`).then(r=>r.json().then(j=>({ok:r.ok,j}))).then(({ok,j})=>{Object.assign(TL[m.id],ok?{events:j.events||[],stats:j.stats||[],t:Date.now()}:{err:j.error||'Indisponible'});if(S.det===m.id)go()}).catch(()=>{TL[m.id].err='Indisponible'})}
const dHead=m=>{const lv=!!m.live,dn=!!m.done,sc=lv?m.live.score:dn?m.score:null,st=lv?(m.live.ht?'Mi-temps':(m.live.min!=null?(typeof m.live.min==='string'?m.live.min:m.live.min+"'"):'En cours')):dn?'Match terminé':'À venir';
 return `<div class="card dh"><div class="sub" style="color:var(--red);text-align:center">${esc(cname(m.comp))} · ${dl(m.kickoff)}</div><div class="dhr"><div class="dht">${lg(m.home,m.homeLogo)}<b>${m.home}</b></div><div class="dhc"><b class="dhs">${sc?sc[0]+' - '+sc[1]:hm(m.kickoff)}</b><span class="${lv?'live':'sub'}">${lv?'<i class="lv"></i> ':''}${st}</span></div><div class="dht">${lg(m.away,m.awayLogo)}<b>${m.away}</b></div></div></div>`};
const SN={possessionPct:'Possession (%)',totalShots:'Tirs',shotsOnTarget:'Tirs cadrés',foulsCommitted:'Fautes',wonCorners:'Corners',yellowCards:'Cartons jaunes',redCards:'Cartons rouges',offsides:'Hors-jeu',saves:'Arrêts'};
const dStats=m=>{const T=TL[m.id];if(!T||!T.stats||!T.stats.length)return'';const H=(T.stats.find(x=>x.s==='h')||{}).st||[],A=(T.stats.find(x=>x.s==='a')||{}).st||[];
 const rows=H.filter(x=>SN[x.n]).map(x=>{const y=A.find(z=>z.n===x.n)||{};return`<div class="dr"><b>${esc(String(x.v))}</b><div class="dc"><div class="sub">${SN[x.n]}</div></div><b>${esc(String(y.v!=null?y.v:''))}</b></div>`});
 return rows.length?`<h2>Statistiques du match</h2><div class="card">${rows.join('')}</div>`:''};
const dTL=m=>{if(!(m.live||m.done))return'';
 const T=TL[m.id],E=T&&T.events?T.events:(m.events||[]).map(x=>({s:x.s,k:x.g?(x.o?'og':'g'):x.r?'r':'y',m:x.m,n:x.n,p:x.p}));
 const h='<h2>Résumé du match</h2>';
 if(!E.length)return h+`<div class="card sub">${T&&T.err?'Détails indisponibles pour ce match.':T&&!T.events?'Chargement…':m.espn||m.events?'Aucun événement enregistré pour le moment.':'Cette source ne fournit pas le détail du match.'}</div>`+dStats(m);
 let a=0,b=0;
 return h+`<div class="card tl">`+E.map(e=>{
  if(e.k==='ht'||e.k==='ft')return `<div class="tm0"><span class="ring">${e.k==='ht'?'MT':'FM'}</span> ${a} - ${b}</div>`;
  if(e.k==='g'||e.k==='og'){((e.s==='h')===(e.k==='g'))?a++:b++}
  const ic=e.k==='g'||e.k==='og'?'⚽':e.k==='y'?'<i class="cd y"></i>':e.k==='r'?'<i class="cd r"></i>':'';
  const body=e.k==='sub'?`<div class="sin">▶ ${esc(e.on||'')}</div><div class="sout">◀ ${esc(e.off||'')}</div>`:`<div>${esc(e.n||'')}${e.k==='g'||e.k==='og'?` (${a} - ${b})`:''}${e.k==='og'?' (csc)':e.p?' (pen.)':''}</div>${e.a?`<div class="sub">Passe décisive de ${esc(e.a)}</div>`:''}`;
  return `<div class="te ${e.s==='h'?'h':'a'}"><b class="tmn">${esc(e.m||'')}</b><span class="tic">${ic}</span><div class="tbd">${body}</div></div>`}).join('')+`</div>`+dStats(m)};
function vD(){const m=ALL.find(x=>x.id==S.det);if(!m){S.det=null;return''}
 loadTL(m);
 const mk=CR.filter(c=>!(c.k=='th'&&MODE=='csv')&&!((m.manual||m.noStats)&&!m.st[c.k][0]&&!m.st[c.k][1])),I=m.info; // match saisi : marchés non renseignés masqués
 const bar=(a,b)=>{const t=a+b||1;return`<div class="split"><i style="width:${a/t*100}%"></i><i class="b" style="width:${b/t*100}%"></i></div>`};
 const blk=(title,src)=>`<h2>${title}</h2><div class="card">`+mk.map(c=>{const a=src[c.k][0],b=src[c.k][1];return`<div class="dr"><b>${f1(a)}</b><div class="dc"><div class="sub">${c.i} ${c.n}</div>${bar(a,b)}<div class="sub">total ${f1(a+b)}</div></div><b>${f1(b)}</b></div>`}).join('')+`</div>`;
 const fm=t=>t.form.split('').map(x=>`<span class="fm" style="background:${FM[x]}">${x}</span>`).join('');
 return `<button class="chip back" onclick="S.det=null;go()">← Retour</button>${dHead(m)}${dTL(m)}`+
 blk(I?`Moyennes par match (${Math.min(I.home.n,I.away.n)} derniers matchs de la saison en cours)`:'Moyennes par match',m.st)+
 (I?`<h2>Forme et buts</h2><div class="card"><div class="dr"><div>${fm(I.home)}</div><div class="dc"><div class="sub">Forme (5 derniers)</div></div><div>${fm(I.away)}</div></div><div class="dr"><b>${f1(I.home.bm)}</b><div class="dc"><div class="sub">Buts marqués / match</div>${bar(I.home.bm,I.away.bm)}</div><b>${f1(I.away.bm)}</b></div><div class="dr"><b>${f1(I.home.be)}</b><div class="dc"><div class="sub">Buts encaissés / match</div>${bar(I.home.be,I.away.be)}</div><b>${f1(I.away.be)}</b></div></div>`:'')+
 (m.real?blk('Statistiques réelles du match',m.real):'')+
 (S.rows.some(r=>r.id==m.id)?`<h2>Pronostics et justifications</h2>`+tipsOf(m).map(t=>`<div class="card"><div class="row" style="margin:0"><div><b>Plus de ${f1(t.line)} ${t.c.n.toLowerCase()}</b><div class="sub"><span class="pp ${pcls(t.p)}">${pc(t.p)}</span></div></div><div class="big">${f2(t.odd)}</div></div>${why(t)}</div>`).join(''):`<h2>Pronostics</h2><div class="card">Aucun pronostic pour ce match : filtre-le dans l'onglet Filtre pour obtenir ses pronostics et leurs justifications.</div>`)+
 `<div class="sub">Source : ${{demo:'données de démonstration',api:'API-Football',csv:'football-data.co.uk'}[MODE]}. Moyennes sur les derniers matchs de championnat de chaque équipe.</div>`}
function od(id){S.det=id;scrollTo(0,0);go()}
function go(v){if(v){S.v=v;S.det=null;if(v=='f')S.fc=null;scrollTo(0,0)}rail();$('#app').innerHTML=S.det!=null?vD():{m:vM,f:vF,a:vA,p:vP,g:vG}[S.v]();tabAnim()}
function th(){const r=document.documentElement;r.dataset.theme=r.dataset.theme=='dark'?'light':'dark'}
$('#src').textContent={demo:'Démo',api:'API-Football',csv:'Données CSV'}[MODE];
const _lv=setInterval(()=>{if(typeof document.hidden==='undefined'||!document.hidden){loadLive();const dm=ALL.find(x=>x.id==S.det);if(dm&&dm.live)loadTL(dm)}},60000);if(_lv&&_lv.unref)_lv.unref();
const _iv=setInterval(()=>{const a=document.activeElement;if(S.v=='m'&&S.r=='live'&&S.det==null&&!(a&&/INPUT|TEXTAREA/.test(a.tagName||'')))go()},60000);if(_iv&&_iv.unref)_iv.unref();
go();
(async()=>{try{ALL=[];const r=await Provider.matches(m=>{ALL.push(m);go()});if(Array.isArray(r))ALL=r;mergeManual();go();loadLogos();loadLive()}
catch(e){$('#st').textContent='';mergeManual();go();$('#app').insertAdjacentHTML('afterbegin',`<div class="card">Impossible de charger les données (${e.message}). Vérifiez la clé côté serveur ou <a href="?demo" style="color:var(--acc)">ouvrez le mode démonstration</a>.</div>`)}})();
</script>
</body>
