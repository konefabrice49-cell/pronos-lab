<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pronos Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2fa;--card:#fff;--ink:#0b1633;--mut:#5a6788;--line:#dbe2f1;--acc:#2f6bff;--red:#d92d3a;--ok:#12994a;--sf:'Barlow',system-ui,sans-serif;--df:'Barlow Condensed','Arial Narrow',sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070d22;--card:#0f1a3a;--ink:#e8edfb;--mut:#8d9ac0;--line:#1e2c55;--acc:#5b93ff;--red:#ff5560;--ok:#34d27b}}
:root[data-theme="dark"]{--bg:#070d22;--card:#0f1a3a;--ink:#e8edfb;--mut:#8d9ac0;--line:#1e2c55;--acc:#5b93ff;--red:#ff5560;--ok:#34d27b}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--sf)}
main{max-width:720px;margin:0 auto;padding:14px 14px 110px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font:700 32px/1 var(--df);margin:0}
.sub{color:var(--mut);font-size:13px}
.rail{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.rail button{all:unset;cursor:pointer;text-align:center;padding:8px 2px 7px;border-top:3px solid transparent;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px}
.rail button:focus-visible,.chip:focus-visible{outline:2px solid var(--acc)}
.rail .ic{display:flex;align-items:center;gap:4px}
.rail b{font:700 17px/1 var(--df);color:var(--ink)}
.rail span{font-size:11.5px}
.rail .on{border-top-color:var(--red);color:var(--red)}
.rail .on b{color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0}
.comp{font:700 21px var(--df);color:var(--red);margin:18px 0 4px}
.m{display:flex;align-items:center;gap:10px;cursor:pointer}
.m .t{width:56px;color:var(--mut);font-size:12.5px;line-height:1.3}
.m .n{flex:1;font-weight:600}
.off{opacity:.45}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.tag.ok{color:var(--ok);border-color:var(--ok)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0}
.chip{flex:none;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:500 14px var(--sf);cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--acc)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}
.big{font:700 30px/1 var(--df)}
.key{border-left:3px solid var(--red);padding-left:10px;margin:8px 0}
input[type=range]{width:100%;accent-color:var(--acc)}
input[type=number]{width:84px;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:500 15px var(--sf)}
label{display:flex;align-items:center;gap:8px;font-weight:600}
summary{cursor:pointer;font-weight:600}
h2{font:700 24px var(--df);margin:14px 0 2px}
.lg{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font:700 11px var(--df);color:#fff;flex:none;object-fit:contain;vertical-align:middle}
.tm{display:flex;align-items:center;gap:8px;font-weight:600;margin:2px 0}
.ck{display:flex;align-items:center;gap:8px;cursor:pointer}
.ck input{width:20px;height:20px;accent-color:var(--acc)}
.tb{width:100%;border-collapse:collapse}.tb th,.tb td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left;font-size:14px;vertical-align:middle}.tb th{color:var(--mut);font-weight:500}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}.mark{width:34px;height:34px;flex:none}
.bn{font:700 22px/1 var(--df);letter-spacing:.02em}.hr{display:flex;align-items:center;gap:8px}
.pill{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
body{font-feature-settings:"tnum" 1}
.card{border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.14)}
h2{font:600 12.5px var(--sf);letter-spacing:.09em;text-transform:uppercase;color:var(--mut);margin:24px 0 8px}
.comp{font:700 19px var(--df);letter-spacing:.02em;padding-bottom:4px;border-bottom:1px solid var(--line)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:middle}
.mkt{padding:10px 0;border-top:1px solid var(--line)}
.lines{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.chip.sm{padding:5px 11px;font-size:13px}
input.ln{width:84px;padding:5px 8px;border-radius:99px;border:1px dashed var(--line);background:transparent;color:var(--ink);font:500 13px var(--sf)}
.bar{height:6px}.bar i.hi{background:var(--ok)}.bar i.mid{background:#f5a524}.bar i.lo{background:var(--red)}
.pp{font-weight:600;padding:1px 7px;border-radius:99px;border:1px solid currentColor}.pp.hi{color:var(--ok)}.pp.mid{color:#f5a524}.pp.lo{color:var(--red)}
.tb th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
.dr{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}.dr:first-child{border-top:0}
.dr>b{font:700 20px var(--df)}.dr>:last-child{text-align:right}.dc{text-align:center}
.split{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line);margin:5px 0}.split i{display:block;height:100%;background:var(--acc)}.split i.b{background:var(--red)}
.duo2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}.tm2{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;text-align:center}.tm2 .lg{width:44px;height:44px;font-size:15px}
.fm{display:inline-flex;width:22px;height:22px;border-radius:6px;align-items:center;justify-content:center;font:700 12px var(--sf);color:#fff;margin-right:3px}
.why div{margin-top:4px}.why summary{color:var(--acc);cursor:pointer}
.lnk{cursor:pointer}
</style>
</head>
<body>
<nav class="rail" id="rail" aria-label="Étapes"></nav>
<main>
<header class="top"><div class="brand"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--acc)"/><path d="M7 22l6-7 4 4 8-10" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><div><div class="bn">Pronos Lab</div><div class="sub">Analyse football</div></div></div><div class="hr"><span class="pill" id="src"></span><button class="chip" onclick="th()" aria-label="Changer de thème">◐</button></div></header>
<div class="sub" id="st"></div>
<div id="app"></div>
<p class="sub">Les probabilités sont des estimations statistiques, jamais des certitudes. Jouez avec modération.</p>
</main>
<script>
// ===== CONFIG API : à renseigner =====
const CONFIG={API_BASE_URL:"/api"}; // la clé API reste sur le serveur (variable API_KEY de server.js)
const Q=new URLSearchParams(location.search);
const MODE=Q.has("demo")?"demo":Q.get("src")==="api"?"api":"csv"; // défaut : CSV gratuit ; ?src=api : API-Football ; ?demo : démonstration
const LIVE=MODE!=="demo";

// ===== COUCHE DONNÉES (séparée de l'interface et de l'analyse) =====
// Format attendu : {id,comp,home,away,kickoff,st:{yc:[dom,ext],sh,fo,th,co},odds?:{yc,sh,fo,th,co}}
const D=(o,h,mi)=>{const d=new Date();d.setDate(d.getDate()+o);d.setHours(h,mi,0,0);return d};
const M=(id,comp,home,away,k,s)=>({id,comp,home,away,kickoff:k,st:{yc:s[0],sh:s[1],fo:s[2],th:s[3],co:s[4]}});
const Demo={async matches(){return[
M(1,'Premier League','Arsenal','Chelsea',D(0,17,30),[[1.7,2.3],[15,12],[10,12],[20,19],[6.1,4.8]]),
M(2,'Premier League','Newcastle','Everton',D(1,16,0),[[2.0,2.4],[14,11.5],[11.5,12.5],[21,20],[5.8,4.9]]),
M(3,'La Liga','Real Madrid','Séville',D(1,21,0),[[1.8,2.6],[16,11],[11,13.5],[19,21],[6.4,4.4]]),
M(4,'La Liga','FC Barcelone','Valence',D(2,18,30),[[1.5,2.4],[17,10],[10,13],[18,22],[6.0,4.6]]),
M(5,'Ligue 1','PSG','Marseille',D(0,21,0),[[1.9,2.6],[17,12],[11,13.5],[19,20],[6.6,4.9]]),
M(6,'Ligue 1','Lyon','Monaco',D(1,19,0),[[1.8,1.7],[13,13],[12,11],[21,20],[5.2,5.0]]),
M(7,'Bundesliga','Bayern','Dortmund',D(2,18,30),[[1.6,2.5],[18,13],[9.5,12],[17,20],[6.8,5.3]]),
M(8,'Bundesliga','Leverkusen','Leipzig',D(3,15,30),[[1.9,2.0],[15,13],[11,12],[20,21],[5.9,5.2]]),
M(9,'Serie A','Inter','Juventus',D(0,20,45),[[2.2,2.5],[13,11],[12.5,13.8],[20,21],[5.6,4.5]]),
M(10,'Serie A','Milan','Naples',D(1,18,0),[[2.3,2.1],[12,14],[12,12.5],[22,19],[5.0,5.5]]),
M(11,'Ligue des champions','Atlético','Benfica',D(3,21,0),[[2.6,2.3],[11,12],[13,12],[19,21],[4.8,5.2]]),
M(12,'Europa League','Roma','Villarreal',D(2,21,0),[[2.1,2.3],[12,11],[12.5,12],[20,19],[5.3,4.7]])]}};
const LEAGUES={39:"Premier League",140:"La Liga",61:"Ligue 1",78:"Bundesliga",135:"Serie A",2:"Ligue des champions",3:"Europa League",5:"Ligue des nations"};
const LAST_N=8,MAX_MATCHES=10,DAYS_AHEAD=1;
const Api={
 async get(p){const r=await fetch(CONFIG.API_BASE_URL+p);const j=await r.json().catch(()=>({}));
  if(!r.ok||(j.errors&&Object.keys(j.errors).length))throw new Error(Object.values(j.errors||{})[0]||"HTTP "+r.status);return j.response},
 stat(l,t){const s=l.find(x=>x.type===t);return parseFloat(s&&s.value)||0},
 async teamAvg(id){ // 2 requêtes par équipe : derniers matchs, puis leurs statistiques (ids=a-b-c)
  const prev=await this.get(`/fixtures?team=${id}&last=${LAST_N}`);
  const det=await this.get(`/fixtures?ids=${prev.map(f=>f.fixture.id).join("-")}`);
  const a={yc:0,sh:0,fo:0,th:0,co:0};let n=0;
  for(const d of det){const t=(d.statistics||[]).find(x=>x.team.id===id);if(!t)continue;n++;
   a.yc+=this.stat(t.statistics,"Yellow Cards");a.sh+=this.stat(t.statistics,"Total Shots");a.fo+=this.stat(t.statistics,"Fouls");
   a.co+=this.stat(t.statistics,"Corner Kicks");a.th+=this.stat(t.statistics,"Throw-ins")}
  return Object.fromEntries(Object.entries(a).map(([k,v])=>[k,n?v/n:0]))},
 async odds(id){ // vraies cotes « Plus de X » : corners et cartons ; les autres critères restent simulés
  try{const r=await this.get("/odds?fixture="+id),bk=(r[0]&&r[0].bookmakers)||[],out={};
   const pick=(k,re)=>{for(const b of bk){const bet=b.bets.find(x=>re.test(x.name)&&/over|under|total/i.test(x.name)&&!/half|asian|home|away|team|race|handicap|exact|odd|red/i.test(x.name));
    if(!bet)continue;const o={};for(const v of bet.values){const m=/^Over\s+([\d.]+)$/i.exec(v.value);if(m)o[m[1]]=parseFloat(v.odd)}
    if(Object.keys(o).length){out[k]=o;return}}};
   pick("co",/corner/i);pick("yc",/card/i);return out}catch(e){return{}}},
 async matches(push){
  const st=t=>{const e=document.getElementById("st");if(e)e.textContent=t};
  let fx=[];
  for(let i=0;i<=DAYS_AHEAD;i++){const d=new Date();d.setDate(d.getDate()+i);st("Recherche des matchs…");
   fx=fx.concat((await this.get("/fixtures?date="+d.toISOString().slice(0,10))).filter(x=>LEAGUES[x.league.id]))}
  fx=fx.slice(0,MAX_MATCHES);if(!fx.length)st("Aucun match trouvé dans ces compétitions.");
  let n=0;
  for(const x of fx){
   try{st(`Analyse du match ${n+1}/${fx.length} (le premier chargement prend quelques minutes)…`);
    const h=await this.teamAvg(x.teams.home.id),a=await this.teamAvg(x.teams.away.id),odds=await this.odds(x.fixture.id),stt={};
    for(const k of ["yc","sh","fo","th","co"])stt[k]=[h[k],a[k]];
    push({id:x.fixture.id,comp:LEAGUES[x.league.id],home:x.teams.home.name,away:x.teams.away.name,homeLogo:x.teams.home.logo,awayLogo:x.teams.away.logo,kickoff:new Date(x.fixture.date),st:stt,odds});n++}
   catch(e){st(`Quota ou limite atteinte : ${n} matchs chargés.`);return}}
  if(n)st("")}
};
const Csv={ // football-data.co.uk : CSV gratuit, sans clé (tirs, corners, fautes, cartons jaunes ; pas de touches)
 DIVS:{E0:"Premier League",SP1:"La Liga",F1:"Ligue 1",D1:"Bundesliga",I1:"Serie A",E1:"Championship",D2:"2. Bundesliga",SP2:"Segunda División",F2:"Ligue 2",I2:"Serie B",N1:"Eredivisie",P1:"Primeira Liga",B1:"Pro League belge",SC0:"Premiership écossaise",T1:"Süper Lig",G1:"Super League grecque",E2:"League One",E3:"League Two",SC1:"Championship écossaise",SC2:"League One écossaise",SC3:"League Two écossaise",EC:"National League"}, // ordre = priorité
 async text(p){const r=await fetch("/csv"+p);if(!r.ok)throw new Error("HTTP "+r.status);return r.text()},
 parse(t){const L=t.replace(/^(\uFEFF|ï»¿)/,"").trim().split(/\r?\n/),h=L[0].split(",");return L.slice(1).map(l=>{const c=l.split(","),o={};h.forEach((k,i)=>o[k]=c[i]);return o})},
 dt(d,t){const[a,b,c]=d.split("/"),[hh,mm]=(t||"12:00").split(":").map(Number);return new Date(c.length==2?2000+ +c:+c,+b-1,+a,hh,mm)},
 async matches(push){
  const st=t=>{const e=document.getElementById("st");if(e)e.textContent=t};
  st("Chargement du calendrier…");
  const now=new Date(),from=now.getTime()-3*36e5,lim=now.getTime()+4*864e5;
  const fx=this.parse(await this.text("/fixtures.csv")).filter(x=>this.DIVS[x.Div]&&x.HomeTeam&&x.Date).map(x=>({...x,k:this.dt(x.Date,x.Time)}))
   .filter(x=>x.k>=from&&x.k<=lim).sort((a,b)=>{const o=Object.keys(this.DIVS);return o.indexOf(a.Div)-o.indexOf(b.Div)||a.k-b.k}).slice(0,MAX_MATCHES);
  const y=now.getMonth()>=6?now.getFullYear():now.getFullYear()-1,p2=n=>String(n%100).padStart(2,"0"),code=p2(y)+p2(y+1),res={};
  for(const d of [...new Set([...fx.map(x=>x.Div),"E0","SP1","F1","D1","I1"])]){st("Chargement des statistiques : "+this.DIVS[d]+"…");
   try{res[d]=this.parse(await this.text(`/mmz4281/${code}/${d}.csv`)).filter(r=>r.HC!==undefined&&r.HC!=="")}catch(e){res[d]=[]}}
  const avg=(rows,team)=>{const g=rows.filter(r=>r.HomeTeam==team||r.AwayTeam==team).slice(-LAST_N);if(g.length<3)return null;
   const a={yc:0,sh:0,fo:0,th:0,co:0};
   for(const r of g){const h=r.HomeTeam==team,q=h?["HY","HS","HF","HC"]:["AY","AS","AF","AC"];a.yc+=+r[q[0]]||0;a.sh+=+r[q[1]]||0;a.fo+=+r[q[2]]||0;a.co+=+r[q[3]]||0}
   const fm=g.slice(-5).map(r=>{const h=r.HomeTeam==team,f=+r[h?"FTHG":"FTAG"],c=+r[h?"FTAG":"FTHG"];return f>c?"V":f<c?"D":"N"}).join("");let bm=0,be=0;
   for(const r of g){const h=r.HomeTeam==team;bm+=+r[h?"FTHG":"FTAG"]||0;be+=+r[h?"FTAG":"FTHG"]||0}
   return {...Object.fromEntries(Object.entries(a).map(([k,v])=>[k,v/g.length])),_i:{form:fm,bm:bm/g.length,be:be/g.length,n:g.length}}};
  let n=0;
  for(const x of fx){const h=avg(res[x.Div],x.HomeTeam),a=avg(res[x.Div],x.AwayTeam);if(!h||!a)continue;
   const s={};for(const k of ["yc","sh","fo","th","co"])s[k]=[h[k],a[k]];
   push({id:1000+n,comp:this.DIVS[x.Div],home:x.HomeTeam,away:x.AwayTeam,kickoff:x.k,st:s,info:{home:h._i,away:a._i}});n++}
  const done=[],MAX_DONE=12,old=now.getTime()-7*864e5;
  for(const d of Object.keys(res)){const rows=res[d];
   rows.forEach((r,i)=>{if(!r.Date||r.FTHG===undefined||r.FTHG==="")return;const k=this.dt(r.Date,r.Time);if(k>now||k.getTime()<old)return;
    const h=avg(rows.slice(0,i),r.HomeTeam),a=avg(rows.slice(0,i),r.AwayTeam);if(!h||!a)return;
    const s={};for(const q of ["yc","sh","fo","th","co"])s[q]=[h[q],a[q]];const re=(x,y)=>[+r[x]||0,+r[y]||0];
    done.push({comp:this.DIVS[d],home:r.HomeTeam,away:r.AwayTeam,kickoff:k,st:s,info:{home:h._i,away:a._i},done:true,score:[+r.FTHG,+r.FTAG],real:{yc:re("HY","AY"),sh:re("HS","AS"),fo:re("HF","AF"),th:[0,0],co:re("HC","AC")},_d:d})})}
  const o=Object.keys(this.DIVS);done.sort((a,b)=>b.kickoff-a.kickoff||o.indexOf(a._d)-o.indexOf(b._d));
  done.slice(0,MAX_DONE).forEach((m,i)=>{m.id=2000+i;push(m)});
  st(n?"":"Aucun match à venir (calendrier mis à jour le mardi et le vendredi). Onglet « Terminés » pour les matchs joués.")}
};
const Provider={demo:Demo,api:Api,csv:Csv}[MODE];

// ===== ÉTAT ET ANALYSE =====
const CR=[{k:'yc',n:'Cartons jaunes',i:'<i class="dot" style="background:#f5c518"></i>',lo:2,hi:8,s:.5},{k:'sh',n:'Tirs',i:'<i class="dot" style="background:#4f8cff"></i>',lo:14,hi:36,s:1},{k:'fo',n:'Fautes',i:'<i class="dot" style="background:#ff5560"></i>',lo:16,hi:32,s:1},{k:'th',n:'Touches',i:'<i class="dot" style="background:#a78bfa"></i>',lo:30,hi:50,s:1},{k:'co',n:'Corners',i:'<i class="dot" style="background:#34d27b"></i>',lo:6,hi:14,s:.5}];
let ALL=[],S={fc:null,P:{f:{},a:{}},comps:new Set(),det:null,cfg:{},rows:[],started:false,msg:'',v:'m',r:'today',c:'all',tgt:2,tol:.25,F:{yc:{on:1,min:4},sh:{on:0,min:24},fo:{on:1,min:22},th:{on:0,min:38},co:{on:1,min:10}}};
const tot=(m,k)=>m.st[k][0]+m.st[k][1];
const same=(a,b)=>a.toDateString()===b.toDateString();
const base=()=>ALL.filter(inR);
const pOver=(l,mu)=>{let s=0,t=Math.exp(-mu);for(let i=0;i<=Math.floor(l);i++){s+=t;t*=mu/(i+1)}return 1-s};
const tipsOf=m=>S.rows.filter(r=>r.id==m.id).map(r=>{const c=CR.find(x=>x.k==r.k),mean=tot(m,c.k),line=r.line;let real=false,odd;
 const ol=m.odds&&m.odds[c.k];
 if(ol&&ol[line]){odd=ol[line];real=true}
 const p=pOver(line,mean);
 return{m,c,mean,line,p,real,odd:real?odd:Math.max(1.05,Math.round(.93/p*100)/100)}});
function combos(tp){const res=[];(function rec(i,cur){
 if(cur.length>=2){const o=cur.reduce((a,t)=>a*t.odd,1);if(Math.abs(o-S.tgt)<=S.tol)res.push({legs:[...cur],odd:o,p:cur.reduce((a,t)=>a*t.p,1)})}
 if(cur.length==3)return;
 for(let j=i;j<tp.length;j++)for(const t of tp[j]){cur.push(t);rec(j+1,cur);cur.pop()}})(0,[]);
 return res.sort((a,b)=>b.p-a.p).slice(0,3)}
const calc=()=>{const rs=S.rows.filter(r=>ALL.some(x=>x.id==r.id)),fl=S.started?[...new Set(rs.map(r=>r.id))].map(id=>ALL.find(x=>x.id==id)):[],tp=fl.map(tipsOf);return{rs,fl,tp,cb:combos(tp)}};

// ===== AFFICHAGE =====
const $=s=>document.querySelector(s);
const f2=n=>n.toFixed(2).replace('.',','),f1=n=>n.toFixed(1).replace('.',',');

 const v=[base().length,rs.length,fl.length,tp.flat().length,cb[0]?f2(cb[0].odd):'–'];

 $('#rail').innerHTML=[['m','Matchs'],['f','Filtre'],['a','Analyse'],['p','Pronos'],['g','Global']].map((x,i)=>`<button class="${S.v==x[0]?'on':''}" onclick="go('${x[0]}')" aria-label="${x[1]}"><div class="ic"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[x[0]]}</svg><b>${v[i]}</b></div><span>${x[1]}</span></button>`).join('')}

try{Object.assign(S.P,JSON.parse(localStorage.getItem("pl")||"{}"))}catch(e){}
const sp=(t,k,v)=>{S.P[t][k]=v;try{localStorage.setItem("pl",JSON.stringify(S.P))}catch(e){}};
const inR=m=>S.r=='all'||(S.r=='done'?!!m.done:!m.done&&(S.r=='today')===same(m.kickoff,new Date()));
const esc=x=>(x||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
const mono=n=>{const w=n.replace(/[^A-Za-zÀ-ÿ ]/g,' ').trim().split(/\s+/);const t=(w.length>1?w[0][0]+w[1][0]:n.slice(0,3)).toUpperCase();let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return`<span class="lg" style="background:hsl(${h} 45% 32%)">${esc(t)}</span>`};
const lg=(n,u)=>u?`<img class="lg" src="${esc(u)}" alt="${esc(n)}" loading="lazy" onerror="this.outerHTML=mono(this.alt)">`:mono(n);
let LOGOS=[];
const LA={'seville':'sevilla','barcelone':'barcelona','valence':'valencia','naples':'napoli','bayern munich':'bayern','psv eindhoven':'psv','man city':'manchester city','man united':'manchester united','nottm forest':'nottingham forest','ath madrid':'atletico madrid','ath bilbao':'athletic','mgladbach':'monchengladbach','ein frankfurt':'eintracht frankfurt','paris sg':'paris saint germain','inter':'internazionale','espanol':'espanyol','vallecano':'rayo vallecano','sp lisbon':'sporting','sp braga':'braga','wolves':'wolverhampton','spurs':'tottenham','newcastle':'newcastle united','west ham':'west ham united','brighton':'brighton hove albion','leicester':'leicester city','ipswich':'ipswich town','leeds':'leeds united','norwich':'norwich city','luton':'luton town','sheffield weds':'sheffield wednesday','stoke':'stoke city','swansea':'swansea city','cardiff':'cardiff city','hull':'hull city','derby':'derby county','blackburn':'blackburn rovers','bristol city':'bristol city','preston':'preston north end','qpr':'queens park rangers','oxford':'oxford united','sociedad':'real sociedad','celta':'celta vigo','alaves':'alaves','leverkusen':'bayer leverkusen','dortmund':'borussia dortmund','werder bremen':'werder bremen','st pauli':'pauli','hertha':'hertha','fortuna dusseldorf':'dusseldorf','napoli':'napoli','lyon':'lyon','marseille':'marseille','monaco':'monaco','psv':'psv','ajax':'ajax','feyenoord':'feyenoord','benfica':'benfica','porto':'porto'};
const nz=t=>t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/'/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\b(fc|cf|afc|ac|as|sc|ssc|ud|cd|rcd|rc|sv|vfb|vfl|tsg|fsv|bv|cp|de|club|calcio|1899|1909|1904|1907|1913|04|05|96|07|1946)\b/g,' ').replace(/\s+/g,' ').trim();
const logoOf=n=>{if(!LOGOS.length)return'';let k=nz(n);k=LA[k]||k;const kt=k.split(' ').filter(Boolean);if(!kt.length)return'';
const ex=LOGOS.find(e=>e.nm.includes(k));if(ex)return ex.c;
 const c=LOGOS.filter(e=>kt.every(t=>e.tk.includes(t))||(kt.length==1&&kt[0].length>=6&&e.tk.some(x=>x.startsWith(kt[0]))));
 return c.length&&new Set(c.map(e=>e.c)).size==1?c[0].c:''};
function applyLogos(){let ch=0;for(const m of ALL){if(!m.homeLogo){const u=logoOf(m.home);if(u){m.homeLogo=u;ch++}}if(!m.awayLogo){const u=logoOf(m.away);if(u){m.awayLogo=u;ch++}}}if(ch)go()}
async function loadLogos(n=0){try{const r=await fetch('/logos');if(r.status===202&&n<14)return setTimeout(()=>loadLogos(n+1),10000);if(!r.ok)return;
 LOGOS=(await r.json()).filter(e=>e.c).map(e=>({c:e.c,nm:[nz(e.n||''),nz(e.s||'')],tk:[...new Set((nz(e.n||'')+' '+nz(e.s||'')).split(' ').filter(Boolean))]}));applyLogos()}catch(e){}}
const two=m=>`<div class="n"><div class="tm">${lg(m.home,m.homeLogo)}${m.home}</div><div class="tm">${lg(m.away,m.awayLogo)}${m.away}</div></div>`;
const vs=m=>`${lg(m.home,m.homeLogo)} <b style="font-size:17px">${m.home} – ${m.away}</b> ${lg(m.away,m.awayLogo)}`;
const hit=t=>t.m.done&&t.m.real?(t.m.real[t.c.k][0]+t.m.real[t.c.k][1])>t.line:null;
try{localStorage.removeItem('pl_code')}catch(e){} // ancien code d'accès IA
const pbox=(t,k)=>`<textarea rows="3" placeholder="Colle ici ton prompt de ${t=='f'?'filtration':'analyse'} pour ${CR.find(c=>c.k==k).n}" oninput="sp('${t}','${k}',this.value)" style="width:100%;margin-top:8px;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:400 14px var(--sf)">${esc(S.P[t][k])}</textarea><button class="chip" style="margin-top:6px" onclick="cp('${t}','${k}')">Copier prompt + matchs</button>`;
function cp(t,k){const c=CR.find(x=>x.k==k),ms=t=='f'?ALL.filter(inR):calc().fl;
 const txt=(S.P[t][k]||"").trim()+"\n\nMatchs ("+c.n+") :\n"+ms.map(m=>`${m.comp} : ${m.home} - ${m.away} | ${m.home} ${f1(m.st[k][0])}, ${m.away} ${f1(m.st[k][1])}, total ${f1(tot(m,k))}`).join("\n");
 (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>alert("Copié : colle-le dans Claude."),()=>alert("Copie impossible sur ce navigateur."))}
const LN={yc:[2.5,3.5,4.5,5.5,6.5],sh:[20.5,22.5,24.5,26.5,28.5],fo:[20.5,22.5,24.5,26.5,28.5],th:[34.5,36.5,38.5,40.5,42.5],co:[7.5,8.5,9.5,10.5,11.5]};
try{Object.assign(S.cfg,JSON.parse(localStorage.getItem('pl_cfg')||'{}'))}catch(e){}
const cfg=(c,k)=>{S.cfg[c]=S.cfg[c]||{};return S.cfg[c][k]=S.cfg[c][k]||{on:0,sel:[LN[k][2]],extra:[]}};
const svc=()=>{try{localStorage.setItem('pl_cfg',JSON.stringify(S.cfg))}catch(e){}};
const pcls=p=>p>=.68?'hi':p>=.58?'mid':'lo';
const why=t=>{const m=t.m,k=t.c.k,a=m.st[k][0],b=m.st[k][1],hi=a>=b?m.home:m.away,gap=t.mean-t.line,nm=t.c.n.toLowerCase(),I=m.info;
 const P=[`${m.home} ${f1(a)} + ${m.away} ${f1(b)} = ${f1(t.mean)} ${nm} par match en moyenne, soit ${f1(Math.abs(gap))} ${gap>=0?'au-dessus':'en dessous'} de la ligne ${f1(t.line)}.`,
 `${hi} pèse le plus dans ce total (${f1(Math.max(a,b))} contre ${f1(Math.min(a,b))}).`,
 `Probabilité estimée à ${pc(t.p)} (loi de Poisson appliquée à cette moyenne) : confiance ${{hi:'forte',mid:'moyenne',lo:'prudente'}[pcls(t.p)]}.`,
 t.real?`Cote ${f2(t.odd)} : elle implique ${pc(1/t.odd)}, contre ${pc(t.p)} estimé ${t.p>1/t.odd?'(écart favorable)':'(pas de valeur apparente)'}.`:`Cote ${f2(t.odd)} simulée à partir de la probabilité (aucune cote réelle pour cette ligne) : vérifie-la chez ton bookmaker.`];
 if(I&&I.home&&I.away&&I.home.form&&I.away.form)P.push(`Forme (5 derniers) : ${m.home} ${I.home.form} · ${m.away} ${I.away.form}. Buts marqués par match : ${f1(I.home.bm)} contre ${f1(I.away.bm)}.`);
 if(hit(t)!==null)P.push(`Résultat réel : ${f1(m.real[k][0]+m.real[k][1])} ${nm} → ${hit(t)?'réussi ✓':'raté ✗'}.`);
 P.push('Limite : moyennes des derniers matchs de chaque équipe, sans arbitre, absences ni forme du jour.');
 return `<div class="why">${P.map(p=>`<div>• ${p}</div>`).join('')}</div>`};
const whyBox=t=>`<details class="sub why" onclick="event.stopPropagation()"><summary>Pourquoi ?</summary>${why(t)}</details>`;
function tc(c,on){on?S.comps.add(c):S.comps.delete(c);S.msg='';go(on?'f':undefined)}
function tm(c,k,on){cfg(c,k).on=on?1:0;svc();go()}
function tl(c,k,l){const o=cfg(c,k),i=o.sel.indexOf(l);i<0?o.sel.push(l):o.sel.splice(i,1);o.sel.sort((a,b)=>a-b);svc();go()}
function al(c,k,v){v=Math.round(parseFloat(String(v).replace(',','.'))*2)/2;if(!(v>0))return go();const o=cfg(c,k);if(!LN[k].includes(v)&&!o.extra.includes(v))o.extra.push(v);if(!o.sel.includes(v))o.sel.push(v);o.sel.sort((a,b)=>a-b);svc();go()}
function runFilter(c){const ks=CR.filter(x=>cfg(c,x.k).on&&cfg(c,x.k).sel.length).map(x=>x.k);
 if(!ks.length){S.msg='Coche un marché et au moins une ligne pour '+c+'.';return go()}
 const ms=ALL.filter(m=>m.comp==c&&inR(m));let add=0;
 for(const k of ks){S.rows=S.rows.filter(r=>!(r.k==k&&(ALL.find(x=>x.id==r.id)||{}).comp==c));
  for(const L of cfg(c,k).sel)for(const m of ms)if(tot(m,k)>=L){S.rows.push({id:m.id,k,line:L});add++}}
 S.msg=add?add+' ligne(s) ajoutée(s) au tableau pour '+c+'.':'Aucun match de '+c+' n\'atteint les lignes choisies.';go()}
function start(){if(!S.rows.length)return;S.started=true;go('a')}
const prompts=()=>`<details class="card"><summary>Mes prompts de filtration</summary>${CR.map(c=>`<div style="margin-top:10px"><b>${c.i} ${c.n}</b>${pbox('f',c.k)}</div>`).join('')}</details>`;
function tableau(){const rs=S.rows.map((r,i)=>({m:ALL.find(x=>x.id==r.id),k:r.k,line:r.line,i})).filter(r=>r.m);
 return `<h2>Matchs filtrés</h2>`+(rs.length?`<div class="card"><table class="tb"><tr><th>Match</th><th>Marché</th><th>Ligne</th><th>Moy.</th><th></th></tr>`+rs.map(r=>{const c=CR.find(x=>x.k==r.k);return `<tr><td style="cursor:pointer" onclick="od(${r.m.id})"><div class="sub" style="color:var(--red)">${r.m.comp}</div>${lg(r.m.home,r.m.homeLogo)}${lg(r.m.away,r.m.awayLogo)} ${r.m.home} – ${r.m.away}</td><td>${c.i} ${c.n}</td><td>+${f1(r.line)}</td><td>${f1(tot(r.m,r.k))}</td><td><button class="chip" onclick="S.rows.splice(${r.i},1);go()" aria-label="Retirer">✕</button></td></tr>`}).join('')+`</table><div class="row"><button class="chip on" onclick="start()">▶ Démarrer</button><button class="chip" onclick="S.rows=[];S.started=false;go()">Vider</button></div></div>`:`<div class="card">Le tableau est vide. Coche un marché, choisis tes lignes puis touche « Filtrer ».</div>`)}
function vF(){const cs=[...S.comps];let h=`<h2>Filtre</h2>`;
 if(!cs.length)h+=`<div class="card">Aucun championnat coché. Coche-en un dans l'onglet Matchs.<div class="row"><button class="chip" onclick="go('m')">Aller dans Matchs</button></div></div>`;
 for(const c of cs){const ms=ALL.filter(m=>m.comp==c&&inR(m));
  h+=`<div class="card"><div class="row" style="margin:0"><b style="color:var(--red);font-size:18px">${c}</b><button class="chip" data-c="${c}" onclick="tc(this.dataset.c,false)">Retirer</button></div><div class="sub">${ms.length} match(s) · ${{today:"aujourd'hui",up:'à venir',done:'terminés',all:'tous'}[S.r]}</div>`+
  CR.map(k=>{const o=cfg(c,k.k),dis=k.k=='th'&&MODE=='csv';
   return `<div class="mkt"><label><input type="checkbox" data-c="${c}" data-k="${k.k}" ${o.on?'checked':''} ${dis?'disabled':''} onchange="tm(this.dataset.c,this.dataset.k,this.checked)"> ${k.i} ${k.n}${dis?' <span class="sub">(indisponible)</span>':''}</label>`+
   (o.on?`<div class="sub" style="margin-top:6px">Lignes « Plus de » (garde les matchs dont la moyenne combinée atteint la ligne)</div><div class="lines">${[...new Set([...LN[k.k],...o.extra])].sort((a,b)=>a-b).map(l=>`<button class="chip sm ${o.sel.includes(l)?'on':''}" data-c="${c}" data-k="${k.k}" data-l="${l}" onclick="tl(this.dataset.c,this.dataset.k,+this.dataset.l)">${f1(l)}</button>`).join('')}<input class="ln" type="number" step=".5" placeholder="+ ligne" data-c="${c}" data-k="${k.k}" onchange="al(this.dataset.c,this.dataset.k,this.value)"></div>`:'')+`</div>`}).join('')+
  `<div class="row"><button class="chip on" data-c="${c}" onclick="runFilter(this.dataset.c)">Filtrer ${c}</button></div></div>`}
 if(S.msg)h+=`<div class="sub">${esc(S.msg)}</div>`;
 return h+tableau()+prompts()}
function vM(){const b=base();
 const rg=[['today',"Aujourd'hui"],['up','À venir'],['done','Terminés'],['all','Tous']].map(r=>`<button class="chip ${S.r==r[0]?'on':''}" onclick="S.r='${r[0]}';go()">${r[1]}</button>`).join('');
 let h=`<div class="chips">${rg}</div><div class="sub">Coche un championnat pour passer au filtre.</div>`;
 if(!b.length)h+=`<div class="card">Aucun match sur cette période. Essayez « Tous ».</div>`;
 for(const c of [...new Set(b.map(m=>m.comp))]){const n=S.rows.filter(r=>{const m=ALL.find(x=>x.id==r.id);return m&&m.comp==c}).length;
  h+=`<label class="comp ck"><input type="checkbox" data-c="${c}" ${S.comps.has(c)?'checked':''} onchange="tc(this.dataset.c,this.checked)"> ${c}${n?` <span class="tag ok">${n} au tableau</span>`:''}</label>`;
  for(const m of b.filter(x=>x.comp==c)){const ic=S.rows.filter(r=>r.id==m.id).map(r=>CR.find(x=>x.k==r.k).i).join('');
   h+=`<div class="card m" style="cursor:pointer" onclick="od(${m.id})"><div class="t">${hm(m.kickoff)}<br>${dl(m.kickoff)}</div>${two(m)}${m.done?`<span class="tag">${m.score[0]}–${m.score[1]}</span>`:ic?`<span class="tag ok">${ic}</span>`:''}</div>`}}
 return h+`<details class="card"><summary>Source des données : ${{demo:'démonstration',api:'API-Football',csv:'football-data.co.uk (CSV gratuit)'}[MODE]}</summary><p class="sub">La clé API reste côté serveur (variable API_KEY). Ajoutez ?demo à l'adresse pour les données de démonstration.</p></details>`}

function vA(){const{fl}=calc();const pr=`<details class="card"><summary>Prompts d'analyse par marché</summary>${CR.map(c=>`<div style="margin-top:10px"><b>${c.i} ${c.n}</b>${pbox('a',c.k)}</div>`).join('')}</details>`;if(!fl.length)return `<h2>Analyse</h2>`+pr+empty('Ajoute des matchs au tableau dans Filtre, puis touche Démarrer.');
 return `<h2>Analyse</h2>`+pr+fl.map(m=>{const tp=tipsOf(m);if(!tp.length)return`<div class="card">${m.home} – ${m.away} : activez au moins un critère.</div>`;
 const k=[...tp].sort((a,b)=>b.p-a.p)[0];
 return `<div class="card" style="cursor:pointer" onclick="od(${m.id})"><div class="sub" style="color:var(--red)">${m.comp} · ${dl(m.kickoff)} ${hm(m.kickoff)}</div>${vs(m)}
 <div class="key">Point clé : ${k.c.n.toLowerCase()}, ${f1(k.mean)} attendus, ${pc(k.p)} de chances de dépasser ${f1(k.line)}.</div>`+
 tp.map(t=>`<div style="margin-top:10px"><div class="row" style="margin:0"><span>${t.c.i} ${t.c.n}</span><span class="sub">${m.home} ${f1(m.st[t.c.k][0])} + ${m.away} ${f1(m.st[t.c.k][1])} = <b>${f1(t.mean)}</b></span></div><div class="bar"><i class="${pcls(t.p)}" style="width:${t.p*100}%"></i></div><div class="sub">Plus de ${f1(t.line)} : ${pc(t.p)}</div>${whyBox(t)}</div>`).join('')+`</div>`}).join('')}

function vP(){const{fl,tp}=calc();if(!fl.length)return empty('Aucun match analysé.');
 return `<h2>Pronostics</h2>`+fl.map((m,i)=>{const t=tp[i],best=[...t].sort((a,b)=>b.p-a.p)[0];
 return `<div class="card" style="cursor:pointer" onclick="od(${m.id})"><div class="sub" style="color:var(--red)">${m.comp}</div>${vs(m)}${m.done?` <span class="tag">Score ${m.score[0]}–${m.score[1]}</span>`:''}`+
 t.map(x=>`<div class="row"><div><b>${x===best?'★ ':''}Plus de ${f1(x.line)} ${x.c.n.toLowerCase()}</b><div class="sub">Moyenne ${f1(x.mean)} · <span class="pp ${pcls(x.p)}">${pc(x.p)}</span>${x.real?'':' · cote simulée'}${hit(x)===null?'':' · réel '+f1(x.m.real[x.c.k][0]+x.m.real[x.c.k][1])+(hit(x)?' ✓':' ✗')}</div>${whyBox(x)}</div><div class="big">${f2(x.odd)}</div></div>`).join('')+`</div>`}).join('')+
 (`<div class="sub">Cote simulée à partir de la probabilité quand la source ne fournit pas la cote du marché (corners, cartons, tirs, fautes).</div>`)}

function vG(){const{fl,cb}=calc();
 let h=`<h2>Pronostic global</h2><div class="card"><div class="row" style="margin:0"><label>Cote visée <input type="number" step=".05" min="1.2" max="10" value="${S.tgt}" onchange="S.tgt=+this.value||2;go()"></label><label>Écart toléré <input type="number" step=".05" min=".05" max="1" value="${S.tol}" onchange="S.tol=+this.value||.25;go()"></label></div></div>`;
 if(fl.length<2)return h+empty('Il faut au moins 2 matchs analysés.');
 if(!cb.length)return h+empty('Aucune combinaison de 2 ou 3 matchs ne correspond à la cote visée.');
 return h+cb.map((c,i)=>`<div class="card"><div class="row" style="margin:0"><b style="font-size:17px">${i==0?'★ ':''}Combinaison ${i+1}</b><div class="big" style="color:var(--red)">${f2(c.odd)}</div></div>`+
 c.legs.map(t=>`<div class="row"><div><b class="lnk" onclick="od(${t.m.id})">${t.m.home} – ${t.m.away} ›</b><div class="sub">Plus de ${f1(t.line)} ${t.c.n.toLowerCase()} · moyenne ${f1(t.mean)} · ${pc(t.p)}${hit(t)===null?'':hit(t)?' · ✓ réussi':' · ✗ raté'}</div>${whyBox(t)}</div><b class="big" style="font-size:22px">${f2(t.odd)}</b></div>`).join('')+
 `<div class="key">Synthèse : ${c.legs.length} matchs, cote totale ${f2(c.odd)}, probabilité conjointe estimée à ${pc(c.p)}. Chaque sélection part d'une moyenne combinée supérieure à sa ligne.${c.legs.every(t=>hit(t)!==null)?` Résultat réel : ${c.legs.every(hit)?'gagné ✓':'perdu ✗'}.`:''}</div></div>`).join('')}

const FM={V:'var(--ok)',N:'#f5a524',D:'var(--red)'};
function vD(){const m=ALL.find(x=>x.id==S.det);if(!m){S.det=null;return''}
 const mk=CR.filter(c=>!(c.k=='th'&&MODE=='csv')),I=m.info;
 const bar=(a,b)=>{const t=a+b||1;return`<div class="split"><i style="width:${a/t*100}%"></i><i class="b" style="width:${b/t*100}%"></i></div>`};
 const blk=(title,src)=>`<h2>${title}</h2><div class="card">`+mk.map(c=>{const a=src[c.k][0],b=src[c.k][1];return`<div class="dr"><b>${f1(a)}</b><div class="dc"><div class="sub">${c.i} ${c.n}</div>${bar(a,b)}<div class="sub">total ${f1(a+b)}</div></div><b>${f1(b)}</b></div>`}).join('')+`</div>`;
 const fm=t=>t.form.split('').map(x=>`<span class="fm" style="background:${FM[x]}">${x}</span>`).join('');
 return `<button class="chip back" onclick="S.det=null;go()">← Retour</button><div class="card"><div class="sub" style="color:var(--red)">${m.comp} · ${dl(m.kickoff)} ${hm(m.kickoff)}</div><div class="duo2"><div class="tm2">${lg(m.home,m.homeLogo)}<b>${m.home}</b></div>${m.done?`<div class="big">${m.score[0]} – ${m.score[1]}</div>`:'<div class="sub">vs</div>'}<div class="tm2">${lg(m.away,m.awayLogo)}<b>${m.away}</b></div></div></div>`+
 blk(I?`Moyennes par match (${Math.min(I.home.n,I.away.n)} derniers matchs)`:'Moyennes par match',m.st)+
