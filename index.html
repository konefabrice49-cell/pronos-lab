<script>
// ===== CONFIG API : à renseigner =====
const CONFIG={API_BASE_URL:"/api"}; // la clé API reste sur le serveur (variable API_KEY de server.js)

const Demo={async matches(){return[
M(1,'Premier League','Arsenal','Chelsea',D(0,17,30),[[1.7,2.3],[15,12],[10,12],[20,19],[6.1,4.8]]),

function vZ(){const L=zzItems(),comps=[...new Set(L.map(x=>x.m.comp))];
 let h=`<div class="zzban"><b>⚽ PRONOSTICS MD ZEZAYE</b><span>Pronostics générés automatiquement à partir des données de l'appli. Ce sont des estimations, jamais des certitudes.${MODE==='demo'?' <em>Démo : données fictives.</em>':''}</span></div>`;
 h+=`<div class="chips">${[['both','Les deux jours'],['today',"Aujourd'hui"],['tomorrow','Demain']].map(x=>`<button class="chip ${ZS.day===x[0]?'on':''}" onclick="ZS.day='${x[0]}';go()">${x[1]}</button>`).join('')}</div>`+
  `<div class="zzfl"><select onchange="ZS.comp=this.value;go()" aria-label="Championnat"><option value="">Tous les championnats</option>${comps.map(c=>`<option value="${zzE(c)}" ${ZS.comp===c?'selected':''}>${zzE(c)}</option>`).join('')}</select><input type="search" placeholder="Équipe…" value="${zzE(ZS.team)}" onchange="ZS.team=this.value;go()" aria-label="Équipe"></div>`+
  `<div class="chips">${[['a','Affiches'],['m','Matchs détaillés'],['h','Historique']].map(x=>`<button class="chip ${ZS.tab===x[0]?'on':''}" onclick="ZS.tab='${x[0]}';go()">${x[1]}</button>`).join('')}</div>`;
 if(ZS.tab==='h')h+=zzHist();
 else if(ZS.tab==='m'){const X=L.filter(x=>(ZS.day==='both'||ZS.day===x.dk)&&(!ZS.comp||x.m.comp===ZS.comp)&&zzTM(x.m,ZS.team));
  h+=X.length?['today','tomorrow'].map(dk=>{const Y=X.filter(x=>x.dk===dk);return Y.length?`<h3 class="zzh3">${dk==='today'?"MATCHS D'AUJOURD'HUI":'MATCHS DE DEMAIN'}</h3>`+[...new Set(Y.map(x=>x.m.comp))].map(c=>`<div class="zzgh">${zzE(typeof cname==='function'?cname(c):c)}</div>`+Y.filter(x=>x.m.comp===c).map(zzDetCard).join('')).join(''):''}).join(''):`<div class="card sub">Aucun match disponible dans la source pour ce filtre.</div>`}
 else{const G=zzGroups(L);ZZ.P=G.out;h+=G.out.length?G.out.map(zzPosterHTML).join(''):`<div class="card sub">Aucune affiche à créer : aucun match avec assez de données pour ce filtre.</div>`;
  if(G.skipped.length)h+=`<div class="sub">Pas assez de données pour un pronostic fiable : ${zzE(G.skipped.join(', '))}.</div>`;
  setTimeout(zzBuild,0)}
 try{zzSnap(L)}catch(e){}
 return h}
const zzBtn=()=>`<button class="zzr6${S.v==='z'?' on':''}" onclick="go('z')" aria-label="PRONOSTICS MD ZEZAYE"><div class="ic"><span class="zzbi">⚽</span></div><span class="zzlb">PRONOSTICS<br>MD ZEZAYE</span></button>`;

const _lv=setInterval(()=>{if(typeof document.hidden==='undefined'||!document.hidden){loadLive();const dm=ALL.find(x=>x.id==S.det);if(dm&&dm.live)loadTL(dm)}},60000);if(_lv&&_lv.unref)_lv.unref();
const _iv=setInterval(()=>{const a=document.activeElement;if(S.v=='m'&&S.r=='live'&&S.det==null&&!(a&&/INPUT|TEXTAREA/.test(a.tagName||'')))go()},60000);if(_iv&&_iv.unref)_iv.unref();
go();
(async()=>{try{ALL=[];const r=await Provider.matches(m=>{ALL.push(m);go()});if(Array.isArray(r))ALL=r;mergeManual();go();loadLogos();loadLive()}
catch(e){$('#st').textContent='';mergeManual();go();$('#app').insertAdjacentHTML('afterbegin',`<div class="card">Impossible de charger les données (${e.message}). Vérifiez la clé côté serveur ou <a href="?demo" style="color:var(--acc)">ouvrez le mode démonstration</a>.</div>`)}})();
