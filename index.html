<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pronos Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2fa;--card:#fff;--ink:#0b1633;--mut:#5a6788;--line:#dbe2f1;--acc:#2f6bff;--red:#d92d3a;--ok:#12994a;--sf:'Barlow',system-ui,sans-serif;--df:'Barlow Condensed','Arial Narrow',sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070d22;--card:#0f1a3a;--ink:#e8edfb;--mut:#8d9ac0;--line:#1e2c55;--acc:#5b93ff;--red:#ff5560;--ok:#34d27b}}
:root[data-theme="dark"]{--bg:#070d22;--card:#0f1a3a;--ink:#e8edfb;--mut:#8d9ac0;--line:#1e2c55;--acc:#5b93ff;--red:#ff5560;--ok:#34d27b}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--sf)}
main{max-width:720px;margin:0 auto;padding:14px 14px 110px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font:700 32px/1 var(--df);margin:0}
.sub{color:var(--mut);font-size:13px}
.rail{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.rail button{all:unset;cursor:pointer;text-align:center;padding:8px 2px 7px;border-top:3px solid transparent;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px}
.rail button:focus-visible,.chip:focus-visible{outline:2px solid var(--acc)}
.rail .ic{display:flex;align-items:center;gap:4px}
.rail b{font:700 17px/1 var(--df);color:var(--ink)}
.rail span{font-size:11.5px}
.rail .on{border-top-color:var(--red);color:var(--red)}
.rail .on b{color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0}
.comp{font:700 21px var(--df);color:var(--red);margin:18px 0 4px}
.m{display:flex;align-items:center;gap:10px;cursor:pointer}
.m .t{width:56px;color:var(--mut);font-size:12.5px;line-height:1.3}
.m .n{flex:1;font-weight:600}
.off{opacity:.45}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.tag.ok{color:var(--ok);border-color:var(--ok)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0}
.chip{flex:none;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:500 14px var(--sf);cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--acc)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}
.big{font:700 30px/1 var(--df)}
.key{border-left:3px solid var(--red);padding-left:10px;margin:8px 0}
input[type=range]{width:100%;accent-color:var(--acc)}
input[type=number]{width:84px;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:500 15px var(--sf)}
label{display:flex;align-items:center;gap:8px;font-weight:600}
summary{cursor:pointer;font-weight:600}
h2{font:700 24px var(--df);margin:14px 0 2px}
.lg{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font:700 11px var(--df);color:#fff;flex:none;object-fit:contain;vertical-align:middle}
.tm{display:flex;align-items:center;gap:8px;font-weight:600;margin:2px 0}
</style>
</head>
<body>
<nav class="rail" id="rail" aria-label="Étapes"></nav>
<main>
<header><div><h1>Pronos Lab</h1><div class="sub">Matchs, filtres, analyse, pronostics, combiné</div></div><button class="chip" onclick="th()" aria-label="Changer de thème">◐</button></header>
<div class="sub" id="st"></div>
<div id="app"></div>
<p class="sub">Les probabilités sont des estimations statistiques, jamais des certitudes. Jouez avec modération.</p>
</main>
<script>
// ===== CONFIG API : à renseigner =====
const CONFIG={API_BASE_URL:"/api"}; // la clé API reste sur le serveur (variable API_KEY de server.js)
const Q=new URLSearchParams(location.search);
const MODE=Q.has("demo")?"demo":Q.get("src")==="api"?"api":"csv"; // défaut : CSV gratuit ; ?src=api : API-Football ; ?demo : démonstration
const LIVE=MODE!=="demo";

// ===== COUCHE DONNÉES (séparée de l'interface et de l'analyse) =====
// Format attendu : {id,comp,home,away,kickoff,st:{yc:[dom,ext],sh,fo,th,co},odds?:{yc,sh,fo,th,co}}
const D=(o,h,mi)=>{const d=new Date();d.setDate(d.getDate()+o);d.setHours(h,mi,0,0);return d};
const M=(id,comp,home,away,k,s)=>({id,comp,home,away,kickoff:k,st:{yc:s[0],sh:s[1],fo:s[2],th:s[3],co:s[4]}});
const Demo={async matches(){return[
M(1,'Premier League','Arsenal','Chelsea',D(0,17,30),[[1.7,2.3],[15,12],[10,12],[20,19],[6.1,4.8]]),
M(2,'Premier League','Newcastle','Everton',D(1,16,0),[[2.0,2.4],[14,11.5],[11.5,12.5],[21,20],[5.8,4.9]]),
M(3,'La Liga','Real Madrid','Séville',D(1,21,0),[[1.8,2.6],[16,11],[11,13.5],[19,21],[6.4,4.4]]),
M(4,'La Liga','FC Barcelone','Valence',D(2,18,30),[[1.5,2.4],[17,10],[10,13],[18,22],[6.0,4.6]]),
M(5,'Ligue 1','PSG','Marseille',D(0,21,0),[[1.9,2.6],[17,12],[11,13.5],[19,20],[6.6,4.9]]),
M(6,'Ligue 1','Lyon','Monaco',D(1,19,0),[[1.8,1.7],[13,13],[12,11],[21,20],[5.2,5.0]]),
M(7,'Bundesliga','Bayern','Dortmund',D(2,18,30),[[1.6,2.5],[18,13],[9.5,12],[17,20],[6.8,5.3]]),
M(8,'Bundesliga','Leverkusen','Leipzig',D(3,15,30),[[1.9,2.0],[15,13],[11,12],[20,21],[5.9,5.2]]),
M(9,'Serie A','Inter','Juventus',D(0,20,45),[[2.2,2.5],[13,11],[12.5,13.8],[20,21],[5.6,4.5]]),
M(10,'Serie A','Milan','Naples',D(1,18,0),[[2.3,2.1],[12,14],[12,12.5],[22,19],[5.0,5.5]]),
M(11,'Ligue des champions','Atlético','Benfica',D(3,21,0),[[2.6,2.3],[11,12],[13,12],[19,21],[4.8,5.2]]),
M(12,'Europa League','Roma','Villarreal',D(2,21,0),[[2.1,2.3],[12,11],[12.5,12],[20,19],[5.3,4.7]])]}};
const LEAGUES={39:"Premier League",140:"La Liga",61:"Ligue 1",78:"Bundesliga",135:"Serie A",2:"Ligue des champions",3:"Europa League",5:"Ligue des nations"};
const LAST_N=8,MAX_MATCHES=10,DAYS_AHEAD=1;
const Api={
 async get(p){const r=await fetch(CONFIG.API_BASE_URL+p);const j=await r.json().catch(()=>({}));
  if(!r.ok||(j.errors&&Object.keys(j.errors).length))throw new Error(Object.values(j.errors||{})[0]||"HTTP "+r.status);return j.response},
 stat(l,t){const s=l.find(x=>x.type===t);return parseFloat(s&&s.value)||0},
 async teamAvg(id){ // 2 requêtes par équipe : derniers matchs, puis leurs statistiques (ids=a-b-c)
  const prev=await this.get(`/fixtures?team=${id}&last=${LAST_N}`);
  const det=await this.get(`/fixtures?ids=${prev.map(f=>f.fixture.id).join("-")}`);
  const a={yc:0,sh:0,fo:0,th:0,co:0};let n=0;
  for(const d of det){const t=(d.statistics||[]).find(x=>x.team.id===id);if(!t)continue;n++;
   a.yc+=this.stat(t.statistics,"Yellow Cards");a.sh+=this.stat(t.statistics,"Total Shots");a.fo+=this.stat(t.statistics,"Fouls");
   a.co+=this.stat(t.statistics,"Corner Kicks");a.th+=this.stat(t.statistics,"Throw-ins")}
  return Object.fromEntries(Object.entries(a).map(([k,v])=>[k,n?v/n:0]))},
 async odds(id){ // vraies cotes « Plus de X » : corners et cartons ; les autres critères restent simulés
  try{const r=await this.get("/odds?fixture="+id),bk=(r[0]&&r[0].bookmakers)||[],out={};
   const pick=(k,re)=>{for(const b of bk){const bet=b.bets.find(x=>re.test(x.name)&&/over|under|total/i.test(x.name)&&!/half|asian|home|away|team|race|handicap|exact|odd|red/i.test(x.name));
    if(!bet)continue;const o={};for(const v of bet.values){const m=/^Over\s+([\d.]+)$/i.exec(v.value);if(m)o[m[1]]=parseFloat(v.odd)}
    if(Object.keys(o).length){out[k]=o;return}}};
   pick("co",/corner/i);pick("yc",/card/i);return out}catch(e){return{}}},
 async matches(push){
  const st=t=>{const e=document.getElementById("st");if(e)e.textContent=t};
  let fx=[];
  for(let i=0;i<=DAYS_AHEAD;i++){const d=new Date();d.setDate(d.getDate()+i);st("Recherche des matchs…");
   fx=fx.concat((await this.get("/fixtures?date="+d.toISOString().slice(0,10))).filter(x=>LEAGUES[x.league.id]))}
  fx=fx.slice(0,MAX_MATCHES);if(!fx.length)st("Aucun match trouvé dans ces compétitions.");
  let n=0;
  for(const x of fx){
   try{st(`Analyse du match ${n+1}/${fx.length} (le premier chargement prend quelques minutes)…`);
    const h=await this.teamAvg(x.teams.home.id),a=await this.teamAvg(x.teams.away.id),odds=await this.odds(x.fixture.id),stt={};
    for(const k of ["yc","sh","fo","th","co"])stt[k]=[h[k],a[k]];
    push({id:x.fixture.id,comp:LEAGUES[x.league.id],home:x.teams.home.name,away:x.teams.away.name,homeLogo:x.teams.home.logo,awayLogo:x.teams.away.logo,kickoff:new Date(x.fixture.date),st:stt,odds});n++}
   catch(e){st(`Quota ou limite atteinte : ${n} matchs chargés.`);return}}
  if(n)st("")}
};
const Csv={ // football-data.co.uk : CSV gratuit, sans clé (tirs, corners, fautes, cartons jaunes ; pas de touches)
 DIVS:{E0:"Premier League",SP1:"La Liga",F1:"Ligue 1",D1:"Bundesliga",I1:"Serie A",E1:"Championship",D2:"2. Bundesliga",SP2:"Segunda División",F2:"Ligue 2",I2:"Serie B",N1:"Eredivisie",P1:"Primeira Liga",B1:"Pro League belge",SC0:"Premiership écossaise",T1:"Süper Lig",G1:"Super League grecque",E2:"League One",E3:"League Two",SC1:"Championship écossaise",SC2:"League One écossaise",SC3:"League Two écossaise",EC:"National League"}, // ordre = priorité
 async text(p){const r=await fetch("/csv"+p);if(!r.ok)throw new Error("HTTP "+r.status);return r.text()},
 parse(t){const L=t.replace(/^(\uFEFF|ï»¿)/,"").trim().split(/\r?\n/),h=L[0].split(",");return L.slice(1).map(l=>{const c=l.split(","),o={};h.forEach((k,i)=>o[k]=c[i]);return o})},
 dt(d,t){const[a,b,c]=d.split("/"),[hh,mm]=(t||"12:00").split(":").map(Number);return new Date(c.length==2?2000+ +c:+c,+b-1,+a,hh,mm)},
 async matches(push){
  const st=t=>{const e=document.getElementById("st");if(e)e.textContent=t};
  st("Chargement du calendrier…");
  const now=new Date(),from=now.getTime()-3*36e5,lim=now.getTime()+4*864e5;
  const fx=this.parse(await this.text("/fixtures.csv")).filter(x=>this.DIVS[x.Div]&&x.HomeTeam&&x.Date).map(x=>({...x,k:this.dt(x.Date,x.Time)}))
   .filter(x=>x.k>=from&&x.k<=lim).sort((a,b)=>{const o=Object.keys(this.DIVS);return o.indexOf(a.Div)-o.indexOf(b.Div)||a.k-b.k}).slice(0,MAX_MATCHES);
  const y=now.getMonth()>=6?now.getFullYear():now.getFullYear()-1,p2=n=>String(n%100).padStart(2,"0"),code=p2(y)+p2(y+1),res={};
  for(const d of [...new Set([...fx.map(x=>x.Div),"E0","SP1","F1","D1","I1"])]){st("Chargement des statistiques : "+this.DIVS[d]+"…");
   try{res[d]=this.parse(await this.text(`/mmz4281/${code}/${d}.csv`)).filter(r=>r.HC!==undefined&&r.HC!=="")}catch(e){res[d]=[]}}
  const avg=(rows,team)=>{const g=rows.filter(r=>r.HomeTeam==team||r.AwayTeam==team).slice(-LAST_N);if(g.length<3)return null;
   const a={yc:0,sh:0,fo:0,th:0,co:0};
   for(const r of g){const h=r.HomeTeam==team,q=h?["HY","HS","HF","HC"]:["AY","AS","AF","AC"];a.yc+=+r[q[0]]||0;a.sh+=+r[q[1]]||0;a.fo+=+r[q[2]]||0;a.co+=+r[q[3]]||0}
   return Object.fromEntries(Object.entries(a).map(([k,v])=>[k,v/g.length]))};
  let n=0;
  for(const x of fx){const h=avg(res[x.Div],x.HomeTeam),a=avg(res[x.Div],x.AwayTeam);if(!h||!a)continue;
   const s={};for(const k of ["yc","sh","fo","th","co"])s[k]=[h[k],a[k]];
   push({id:1000+n,comp:this.DIVS[x.Div],home:x.HomeTeam,away:x.AwayTeam,kickoff:x.k,st:s});n++}
  const done=[],MAX_DONE=12,old=now.getTime()-7*864e5;
  for(const d of Object.keys(res)){const rows=res[d];
   rows.forEach((r,i)=>{if(!r.Date||r.FTHG===undefined||r.FTHG==="")return;const k=this.dt(r.Date,r.Time);if(k>now||k.getTime()<old)return;
    const h=avg(rows.slice(0,i),r.HomeTeam),a=avg(rows.slice(0,i),r.AwayTeam);if(!h||!a)return;
    const s={};for(const q of ["yc","sh","fo","th","co"])s[q]=[h[q],a[q]];const re=(x,y)=>[+r[x]||0,+r[y]||0];
    done.push({comp:this.DIVS[d],home:r.HomeTeam,away:r.AwayTeam,kickoff:k,st:s,done:true,score:[+r.FTHG,+r.FTAG],real:{yc:re("HY","AY"),sh:re("HS","AS"),fo:re("HF","AF"),th:[0,0],co:re("HC","AC")},_d:d})})}
  const o=Object.keys(this.DIVS);done.sort((a,b)=>b.kickoff-a.kickoff||o.indexOf(a._d)-o.indexOf(b._d));
  done.slice(0,MAX_DONE).forEach((m,i)=>{m.id=2000+i;push(m)});
  st(n?"":"Aucun match à venir (calendrier mis à jour le mardi et le vendredi). Onglet « Terminés » pour les matchs joués.")}
};
const Provider={demo:Demo,api:Api,csv:Csv}[MODE];

// ===== ÉTAT ET ANALYSE =====
const CR=[{k:'yc',n:'Cartons jaunes',i:'🟨',lo:2,hi:8,s:.5},{k:'sh',n:'Tirs',i:'🎯',lo:14,hi:36,s:1},{k:'fo',n:'Fautes',i:'🚩',lo:16,hi:32,s:1},{k:'th',n:'Touches',i:'🙌',lo:30,hi:50,s:1},{k:'co',n:'Corners',i:'⛳',lo:6,hi:14,s:.5}];
let ALL=[],S={fc:null,P:{f:{},a:{}},AI:{f:{},a:{}},msg:'',v:'m',r:'today',c:'all',off:new Set(),tgt:2,tol:.25,F:{yc:{on:1,min:4},sh:{on:0,min:24},fo:{on:1,min:22},th:{on:0,min:38},co:{on:1,min:10}}};
const tot=(m,k)=>m.st[k][0]+m.st[k][1];
const same=(a,b)=>a.toDateString()===b.toDateString();
const base=()=>ALL.filter(m=>(S.c=='all'||m.comp==S.c)&&inR(m));
const scope=()=>base().filter(m=>!S.off.has(m.id)&&(S.r=='done'||!m.done));
const aiOn=()=>Object.keys(S.AI.f).length>0;
const kept=(m,k)=>S.AI.f[k]?!!(S.AI.f[k][m.id]&&S.AI.f[k][m.id].keep===true):tot(m,k)>=S.F[k].min;
const pass=m=>aiOn()?tipsOf(m).length>0:CR.every(c=>!S.F[c.k].on||tot(m,c.k)>=S.F[c.k].min);
const pOver=(l,mu)=>{let s=0,t=Math.exp(-mu);for(let i=0;i<=Math.floor(l);i++){s+=t;t*=mu/(i+1)}return 1-s};
const tipsOf=m=>CR.filter(c=>S.F[c.k].on&&(!aiOn()||(S.AI.f[c.k]&&kept(m,c.k)))).map(c=>{const mean=tot(m,c.k);let line=Math.floor(mean-.35*Math.sqrt(mean))+.5,real=false,odd;
 const ol=m.odds&&m.odds[c.k];
 if(ol){const ls=Object.keys(ol).map(Number);if(ls.length){line=ls.reduce((a,b)=>Math.abs(b-line)<Math.abs(a-line)?b:a);odd=ol[line];real=true}}
 const p=pOver(line,mean);
 return{m,c,mean,line,p,real,odd:real?odd:Math.max(1.05,Math.round(.93/p*100)/100)}});
function combos(tp){const res=[];(function rec(i,cur){
 if(cur.length>=2){const o=cur.reduce((a,t)=>a*t.odd,1);if(Math.abs(o-S.tgt)<=S.tol)res.push({legs:[...cur],odd:o,p:cur.reduce((a,t)=>a*t.p,1)})}
 if(cur.length==3)return;
 for(let j=i;j<tp.length;j++)for(const t of tp[j]){cur.push(t);rec(j+1,cur);cur.pop()}})(0,[]);
 return res.sort((a,b)=>b.p-a.p).slice(0,3)}
const calc=()=>{const sc=scope(),fl=sc.filter(pass),tp=fl.map(tipsOf);return{sc,fl,tp,cb:combos(tp)}};

// ===== AFFICHAGE =====
const $=s=>document.querySelector(s);
const f2=n=>n.toFixed(2).replace('.',','),f1=n=>n.toFixed(1).replace('.',',');
const hm=d=>d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
const dl=d=>d.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
const pc=p=>Math.round(p*100)+' %';
const empty=t=>`<div class="card">${t}<div class="row"><button class="chip" onclick="go('f')">Ajuster les filtres</button></div></div>`;

function rail(){const{sc,fl,tp,cb}=calc();
 const v=[sc.length,fl.length,fl.length,tp.flat().length,cb[0]?f2(cb[0].odd):'–'];
 const IC={m:'<circle cx="12" cy="12" r="9"/><path d="M12 7l4 3-1.5 5h-5L8 10z"/>',f:'<path d="M3 5h18l-7 8v6l-4-2v-4z"/>',a:'<path d="M3 20h5v-5h5v-5h5V5h3"/>',p:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',g:'<path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H4v1a4 4 0 0 0 4 4M16 6h4v1a4 4 0 0 1-4 4M12 13v4M8 20h8"/>'};
 $('#rail').innerHTML=[['m','Matchs'],['f','Filtre'],['a','Analyse'],['p','Pronos'],['g','Global']].map((x,i)=>`<button class="${S.v==x[0]?'on':''}" onclick="go('${x[0]}')" aria-label="${x[1]}"><div class="ic"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[x[0]]}</svg><b>${v[i]}</b></div><span>${x[1]}</span></button>`).join('')}

try{Object.assign(S.P,JSON.parse(localStorage.getItem("pl")||"{}"))}catch(e){}
const sp=(t,k,v)=>{S.P[t][k]=v;try{localStorage.setItem("pl",JSON.stringify(S.P))}catch(e){}};
const inR=m=>S.r=='all'||(S.r=='done'?!!m.done:!m.done&&(S.r=='today')===same(m.kickoff,new Date()));
const esc=x=>(x||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
const mono=n=>{const w=n.replace(/[^A-Za-zÀ-ÿ ]/g,' ').trim().split(/\s+/);const t=(w.length>1?w[0][0]+w[1][0]:n.slice(0,3)).toUpperCase();let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return`<span class="lg" style="background:hsl(${h} 45% 32%)">${esc(t)}</span>`};
const lg=(n,u)=>u?`<img class="lg" src="${esc(u)}" alt="${esc(n)}" loading="lazy" onerror="this.outerHTML=mono(this.alt)">`:mono(n);
const two=m=>`<div class="n"><div class="tm">${lg(m.home,m.homeLogo)}${m.home}</div><div class="tm">${lg(m.away,m.awayLogo)}${m.away}</div></div>`;
const vs=m=>`${lg(m.home,m.homeLogo)} <b style="font-size:17px">${m.home} – ${m.away}</b> ${lg(m.away,m.awayLogo)}`;
const hit=t=>t.m.done&&t.m.real?(t.m.real[t.c.k][0]+t.m.real[t.c.k][1])>t.line:null;
const getCode=()=>{try{return localStorage.getItem('pl_code')||''}catch(e){return''}};
const setCode=v=>{try{localStorage.setItem('pl_code',v)}catch(e){}};
async function askAI(type,k,ms){
 const c=CR.find(x=>x.k==k),prompt=(S.P[type][k]||'').trim();
 const matches=ms.map(m=>{const o={id:m.id,championnat:m.comp,domicile:m.home,exterieur:m.away,date:dl(m.kickoff),moyenne_domicile:+m.st[k][0].toFixed(2),moyenne_exterieur:+m.st[k][1].toFixed(2),total_attendu:+tot(m,k).toFixed(2)};
  if(type=='a'){const t=tipsOf(m).find(x=>x.c.k==k);if(t){o.ligne_proposee=t.line;o.probabilite_calculee_pct=Math.round(t.p*100)}}return o});
 const r=await fetch('/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:getCode(),type,market:c.n,prompt,matches})});
 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'HTTP '+r.status);
 const o={};for(const x of j.results||[])o[x.id]=x;return o}
async function runF(){const ks=CR.filter(c=>S.F[c.k].on&&(S.P.f[c.k]||'').trim()),ms=scope();
 if(!ks.length){S.msg="Colle d'abord un prompt de filtration pour au moins un marché activé.";return go()}
 if(!ms.length){S.msg='Aucun match choisi à filtrer.';return go()}
 S.AI.f={};
 try{for(const c of ks){S.msg='Filtrage « '+c.n+' » en cours…';go();S.AI.f[c.k]=await askAI('f',c.k,ms)}S.msg='Filtrage terminé : '+ks.length+' marché(s) appliqué(s).'}
 catch(e){S.AI.f={};S.msg='Erreur : '+e.message}
 go()}
async function runA(){const ks=CR.filter(c=>S.F[c.k].on&&(S.P.a[c.k]||'').trim()),fl=calc().fl;
 if(!ks.length){S.msg="Colle d'abord un prompt d'analyse pour au moins un marché activé.";return go()}
 if(!fl.length){S.msg='Aucun match retenu à analyser.';return go()}
 S.AI.a={};
 try{for(const c of ks){const mm=fl.filter(m=>tipsOf(m).some(t=>t.c.k==c.k));if(!mm.length)continue;S.msg='Analyse « '+c.n+' » en cours…';go();S.AI.a[c.k]=await askAI('a',c.k,mm)}S.msg='Analyse terminée.'}
 catch(e){S.AI.a={};S.msg='Erreur : '+e.message}
 go()}
const clr=()=>{S.AI={f:{},a:{}};S.msg='Résultats effacés : retour aux seuils chiffrés.';go()};
const aiTxt=(m,k)=>{const f=S.AI.f[k]&&S.AI.f[k][m.id],a=S.AI.a[k]&&S.AI.a[k][m.id];return(f&&f.why?`<div class="sub">Filtre : ${esc(f.why)}</div>`:'')+(a&&a.analyse?`<div class="key">${esc(a.analyse)}</div>`:'')};
const aibox=t=>`<div class="card"><b>🤖 Mes prompts</b><div class="sub">${t=='f'?"Chaque prompt de filtration est appliqué aux matchs choisis, marché par marché. Les matchs que ton prompt écarte sortent de l'analyse.":"Chaque prompt d'analyse est appliqué aux matchs retenus."} L'IA ne reçoit que les statistiques de l'appli.</div>
 <label style="margin-top:8px">Code d'accès <input type="password" value="${esc(getCode()).replace(/"/g,'&quot;')}" onchange="setCode(this.value)" style="width:140px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px"></label>
 <div class="row"><button class="chip on" onclick="${t=='f'?'runF()':'runA()'}">▶ ${t=='f'?'Filtrer':'Analyser'} avec mes prompts</button>${aiOn()||Object.keys(S.AI.a).length?'<button class="chip" onclick="clr()">Effacer</button>':''}</div>
 <div class="sub">${esc(S.msg)}</div></div>`;
const pbox=(t,k)=>`<textarea rows="3" placeholder="Colle ici ton prompt de ${t=='f'?'filtration':'analyse'} pour ${CR.find(c=>c.k==k).n}" oninput="sp('${t}','${k}',this.value)" style="width:100%;margin-top:8px;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:400 14px var(--sf)">${esc(S.P[t][k])}</textarea><button class="chip" style="margin-top:6px" onclick="cp('${t}','${k}')">Copier prompt + matchs</button>`;
function cp(t,k){const c=CR.find(x=>x.k==k),ms=t=='f'?ALL.filter(m=>inR(m)&&!S.off.has(m.id)):calc().fl;
 const txt=(S.P[t][k]||"").trim()+"\n\nMatchs ("+c.n+") :\n"+ms.map(m=>`${m.comp} : ${m.home} - ${m.away} | ${m.home} ${f1(m.st[k][0])}, ${m.away} ${f1(m.st[k][1])}, total ${f1(tot(m,k))}`).join("\n");
 (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>alert("Copié : colle-le dans Claude."),()=>alert("Copie impossible sur ce navigateur."))}
function selAll(on){ALL.filter(m=>inR(m)&&m.comp==S.fc).forEach(m=>on?S.off.delete(m.id):S.off.add(m.id));go()}
function vF(){
 const rg=[['today',"Aujourd'hui"],['up','À venir'],['done','Terminés'],['all','Tous']].map(r=>`<button class="chip ${S.r==r[0]?'on':''}" onclick="S.r='${r[0]}';S.fc=null;go()">${r[1]}</button>`).join('');
 const b=ALL.filter(inR);
 if(S.fc){return `<div class="chips">${rg}</div><div class="chips"><button class="chip" onclick="S.fc=null;go()">← Championnats</button><button class="chip" onclick="selAll(1)">Tout garder</button><button class="chip" onclick="selAll(0)">Tout laisser</button></div><div class="comp">${S.fc}</div><div class="sub">Touchez un match pour le garder ou le laisser. Les matchs laissés sont ignorés par l'analyse.</div>`+
  b.filter(m=>m.comp==S.fc).map(m=>{const off=S.off.has(m.id);return `<div class="card m ${off?'off':''}" onclick="S.off[S.off.has(${m.id})?'delete':'add'](${m.id});go()"><div class="t">${hm(m.kickoff)}<br>${dl(m.kickoff)}</div>${two(m)}<span class="tag ${off?'':'ok'}">${m.done?m.score[0]+'–'+m.score[1]:off?'Laissé':'Gardé'}</span></div>`}).join('')}
 const cs=[...new Set(b.map(m=>m.comp))];
 return `<h2>Championnats</h2><div class="chips">${rg}</div><div class="sub">Touchez un championnat pour choisir ses matchs.</div>`+
  (cs.length?cs.map(c=>{const ms=b.filter(m=>m.comp==c),k=ms.filter(m=>!S.off.has(m.id)).length;return `<div class="card m" data-c="${c}" onclick="S.fc=this.dataset.c;go()"><div class="n" style="color:var(--red)">${c}</div><span class="tag ${k?'ok':''}">${k}/${ms.length} matchs ›</span></div>`}).join(''):`<div class="card">Aucun match sur cette période. Essayez « Tous ».</div>`)+crit()}
function vM(){const b=base(),comps=[...new Set(ALL.map(m=>m.comp))];
 const rg=[['today','Aujourd\'hui'],['up','À venir'],['done','Terminés'],['all','Tous']].map(r=>`<button class="chip ${S.r==r[0]?'on':''}" onclick="S.r='${r[0]}';go()">${r[1]}</button>`).join('');
 const cp=['all',...comps].map(c=>`<button class="chip ${S.c==c?'on':''}" onclick="S.c=this.dataset.c;go()" data-c="${c}">${c=='all'?'Toutes les compétitions':c}</button>`).join('');
 let h=`<div class="chips">${rg}</div><div class="chips">${cp}</div><div class="sub">Touchez un match pour l'exclure ou le réintégrer.</div>`;
 if(!b.length)h+=`<div class="card">Aucun match sur cette période. Essayez « Tous ».</div>`;
 for(const c of [...new Set(b.map(m=>m.comp))]){h+=`<div class="comp">${c}</div>`;
  for(const m of b.filter(x=>x.comp==c)){const off=S.off.has(m.id);
   h+=`<div class="card m ${off?'off':''}" onclick="S.off[S.off.has(${m.id})?'delete':'add'](${m.id});go()"><div class="t">${hm(m.kickoff)}<br>${dl(m.kickoff)}</div>${two(m)}<span class="tag ${!off&&pass(m)?'ok':''}">${m.done?m.score[0]+'–'+m.score[1]:off?'Exclu':pass(m)?'Retenu':'Écarté'}</span></div>`}}
 return h+`<details class="card"><summary>Source des données : ${{demo:'démonstration',api:'API-Football',csv:'football-data.co.uk (CSV gratuit)'}[MODE]}</summary><p class="sub">La clé API reste côté serveur (variable API_KEY). Ajoutez ?demo à l'adresse pour les données de démonstration. L'accès aux données est isolé dans les objets Demo et Api : changer d'API ne touche ni l'interface ni l'analyse.</p></details>`}

function crit(){const sc=scope();
 return aibox('f')+`<h2>Critères par marché</h2><div class="sub">Moyenne combinée minimale des deux équipes, et ton prompt de filtration pour chaque marché.</div>`+CR.map(c=>{const f=S.F[c.k];
 return `<div class="card"><label><input type="checkbox" ${f.on?'checked':''} ${c.k=='th'&&MODE=='csv'?'disabled':''} onchange="S.F.${c.k}.on=this.checked?1:0;go()"> ${c.i} ${c.n}${c.k=='th'&&MODE=='csv'?' (indisponible avec cette source)':''}</label>
 <div class="row"><span class="sub">Minimum attendu</span><b class="big" id="v-${c.k}">${f1(f.min)}</b></div>
 <input type="range" min="${c.lo}" max="${c.hi}" step="${c.s}" value="${f.min}" ${f.on?'':'disabled'} oninput="mn('${c.k}',this.value)" aria-label="Minimum ${c.n}">
 <div class="sub" id="n-${c.k}">${f.on?sc.filter(m=>tot(m,c.k)>=f.min).length+' sur '+sc.length+' matchs correspondent':'Critère désactivé'}</div>${pbox('f',c.k)}</div>`}).join('')+
 `<div class="card"><b id="fres">${sc.filter(pass).length} matchs</b> envoyés automatiquement vers l'analyse.</div>`}
function mn(k,v){S.F[k].min=+v;const sc=scope();$('#v-'+k).textContent=f1(+v);$('#n-'+k).textContent=sc.filter(m=>tot(m,k)>=+v).length+' sur '+sc.length+' matchs correspondent';$('#fres').textContent=sc.filter(pass).length+' matchs';rail()}

function vA(){const{fl}=calc();const pr=`<details class="card"><summary>Prompts d'analyse par marché</summary>${CR.map(c=>`<div style="margin-top:10px"><b>${c.i} ${c.n}</b>${pbox('a',c.k)}</div>`).join('')}</details>`;if(!fl.length)return `<h2>Analyse</h2>`+pr+aibox('a')+empty('Aucun match retenu par vos filtres.');
 return `<h2>Analyse</h2>`+pr+aibox('a')+fl.map(m=>{const tp=tipsOf(m);if(!tp.length)return`<div class="card">${m.home} – ${m.away} : activez au moins un critère.</div>`;
 const k=[...tp].sort((a,b)=>b.p-a.p)[0];
 return `<div class="card"><div class="sub" style="color:var(--red)">${m.comp} · ${dl(m.kickoff)} ${hm(m.kickoff)}</div>${vs(m)}
 <div class="key">Point clé : ${k.c.n.toLowerCase()}, ${f1(k.mean)} attendus, ${pc(k.p)} de chances de dépasser ${f1(k.line)}.</div>`+
 tp.map(t=>`<div style="margin-top:10px"><div class="row" style="margin:0"><span>${t.c.i} ${t.c.n}</span><span class="sub">${m.home} ${f1(m.st[t.c.k][0])} + ${m.away} ${f1(m.st[t.c.k][1])} = <b>${f1(t.mean)}</b></span></div><div class="bar"><i style="width:${t.p*100}%"></i></div><div class="sub">Plus de ${f1(t.line)} : ${pc(t.p)}</div>${aiTxt(m,t.c.k)}</div>`).join('')+`</div>`}).join('')}

function vP(){const{fl,tp}=calc();if(!fl.length)return empty('Aucun match analysé.');
 return `<h2>Pronostics</h2>`+fl.map((m,i)=>{const t=tp[i],best=[...t].sort((a,b)=>b.p-a.p)[0];
 return `<div class="card"><div class="sub" style="color:var(--red)">${m.comp}</div>${vs(m)}${m.done?` <span class="tag">Score ${m.score[0]}–${m.score[1]}</span>`:''}`+
 t.map(x=>`<div class="row"><div><b>${x===best?'★ ':''}Plus de ${f1(x.line)} ${x.c.n.toLowerCase()}</b><div class="sub">Moyenne ${f1(x.mean)} · ${pc(x.p)} estimé${x.real?'':' · cote simulée'}${hit(x)===null?'':' · réel '+f1(x.m.real[x.c.k][0]+x.m.real[x.c.k][1])+(hit(x)?' ✓':' ✗')}</div></div><div class="big">${f2(x.odd)}</div></div>`).join('')+`</div>`}).join('')+
 (`<div class="sub">Cote simulée à partir de la probabilité quand la source ne fournit pas la cote du marché (corners, cartons, tirs, fautes).</div>`)}

function vG(){const{fl,cb}=calc();
 let h=`<h2>Pronostic global</h2><div class="card"><div class="row" style="margin:0"><label>Cote visée <input type="number" step=".05" min="1.2" max="10" value="${S.tgt}" onchange="S.tgt=+this.value||2;go()"></label><label>Écart toléré <input type="number" step=".05" min=".05" max="1" value="${S.tol}" onchange="S.tol=+this.value||.25;go()"></label></div></div>`;
 if(fl.length<2)return h+empty('Il faut au moins 2 matchs analysés.');
 if(!cb.length)return h+empty('Aucune combinaison de 2 ou 3 matchs ne correspond à la cote visée.');
 return h+cb.map((c,i)=>`<div class="card"><div class="row" style="margin:0"><b style="font-size:17px">${i==0?'★ ':''}Combinaison ${i+1}</b><div class="big" style="color:var(--red)">${f2(c.odd)}</div></div>`+
 c.legs.map(t=>`<div class="row"><div><b>${t.m.home} – ${t.m.away}</b><div class="sub">Plus de ${f1(t.line)} ${t.c.n.toLowerCase()} · moyenne ${f1(t.mean)} · ${pc(t.p)}${hit(t)===null?'':hit(t)?' · ✓ réussi':' · ✗ raté'}</div></div><b class="big" style="font-size:22px">${f2(t.odd)}</b></div>`).join('')+
 `<div class="key">Synthèse : ${c.legs.length} matchs, cote totale ${f2(c.odd)}, probabilité conjointe estimée à ${pc(c.p)}. Chaque sélection part d'une moyenne combinée supérieure à sa ligne.${c.legs.every(t=>hit(t)!==null)?` Résultat réel : ${c.legs.every(hit)?'gagné ✓':'perdu ✗'}.`:''}</div></div>`).join('')}

function go(v){if(v){S.v=v;if(v=='f')S.fc=null;scrollTo(0,0)}rail();$('#app').innerHTML={m:vM,f:vF,a:vA,p:vP,g:vG}[S.v]()}
function th(){const r=document.documentElement;r.dataset.theme=r.dataset.theme=='dark'?'light':'dark'}
go();
(async()=>{try{ALL=[];const r=await Provider.matches(m=>{ALL.push(m);go()});if(Array.isArray(r))ALL=r;go()}
catch(e){$('#st').textContent='';go();$('#app').insertAdjacentHTML('afterbegin',`<div class="card">Impossible de charger les données (${e.message}). Vérifiez la clé côté serveur ou <a href="?demo" style="color:var(--acc)">ouvrez le mode démonstration</a>.</div>`)}})();
</script>
</body>
</html>
